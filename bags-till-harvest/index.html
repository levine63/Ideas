<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bags Till Harvest Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
body{margin:0}
:root{
  --ground:#E9ECE1; --panel:#F7F8F2; --ink:#1E2A1B; --ink2:#4B5746; --muted:#6E7868;
  --line:#CBD1C0; --maize:#E9A800; --maize-soft:#F7E2A3; --sack:#B98A4E; --sack-dk:#8A6231;
  --leaf:#2F6B34; --leaf-soft:#D5E6CF; --hungry:#B3402A; --hungry-soft:#F2D3CA;
  --rain:#2F5F93; --phone:#FFFFFF; --phone-edge:#1E2A1B; --chip:#EEF1E6;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#141A13; --panel:#1C241B; --ink:#E8EDE2; --ink2:#B9C3B1; --muted:#8E9986;
    --line:#34402F; --maize:#F2B92A; --maize-soft:#4A3C12; --sack:#C79A5F; --sack-dk:#E0B880;
    --leaf:#7DBB73; --leaf-soft:#233A22; --hungry:#EE7A62; --hungry-soft:#4A2219;
    --rain:#8DB6E4; --phone:#101610; --phone-edge:#3C4A36; --chip:#232D21;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#141A13; --panel:#1C241B; --ink:#E8EDE2; --ink2:#B9C3B1; --muted:#8E9986;
  --line:#34402F; --maize:#F2B92A; --maize-soft:#4A3C12; --sack:#C79A5F; --sack-dk:#E0B880;
  --leaf:#7DBB73; --leaf-soft:#233A22; --hungry:#EE7A62; --hungry-soft:#4A2219;
  --rain:#8DB6E4; --phone:#101610; --phone-edge:#3C4A36; --chip:#232D21;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--rain);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:28px}
header.top{display:grid;gap:6px;max-width:72ch}
header.top h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.4vw,44px);line-height:1.05;margin:0;text-wrap:balance}
header.top p{margin:0;color:var(--ink2)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stage{display:grid;grid-template-columns:400px 1fr;gap:32px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}}

/* ---------- phone ---------- */
.phone{width:100%;max-width:400px;margin:0 auto;background:var(--phone);border:10px solid var(--phone-edge);border-radius:34px;height:760px;display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (max-width:900px){.phone{height:720px}}
.pbar{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.dots{display:flex;gap:5px;flex:1}
.dots i{height:8px;flex:1;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--maize)}
.dots i.done{background:var(--leaf)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:20px;line-height:1}
.guide{display:flex;gap:10px;align-items:flex-start;padding:4px 14px 10px}
.guide .face{flex:none;width:52px;height:52px}
.bubble{position:relative;background:var(--maize-soft);border-radius:16px;padding:9px 12px;font-size:16px;line-height:1.35;flex:1}
.bubble b{font-weight:700}
.say{border:none;background:none;font-size:18px;padding:0 0 0 6px;vertical-align:middle}
.pbody{flex:1;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
.pfoot{display:flex;gap:10px;padding:10px 14px 14px;border-top:1px solid var(--line)}
.big{flex:1;min-height:58px;border-radius:16px;border:none;font-family:var(--display);font-weight:700;font-size:21px;display:flex;align-items:center;justify-content:center;gap:8px}
.big.go{background:var(--leaf);color:#fff}
:root[data-theme="dark"] .big.go{color:#0F1A0E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .big.go{color:#0F1A0E}}
.big.back{flex:0 0 64px;background:var(--chip);border:2px solid var(--line)}

.granary{display:flex;justify-content:center}
.sacks{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:40px}
.sacks svg{width:30px;height:34px}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.stepper button{width:64px;height:64px;border-radius:50%;border:3px solid var(--sack);background:var(--panel);font-size:32px;font-weight:700;line-height:1}
.stepper .n{font-family:var(--display);font-size:46px;font-weight:800;min-width:92px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.unit{text-align:center;color:var(--ink2);font-size:15px;margin-top:-6px}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.small{font-size:14px;color:var(--muted);text-align:center}
.money{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--chip);border-radius:14px;padding:8px}
.money button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:20px}
.money .n{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}

.months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.m{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 2px;display:grid;justify-items:center;gap:0;min-height:62px}
.m .ic{font-size:20px;line-height:1.1}
.m .nm{font-size:13px;font-weight:700}
.m.sel{border-color:var(--maize);background:var(--maize-soft);box-shadow:0 0 0 2px var(--maize) inset}
.m.hung{border-color:var(--hungry);background:var(--hungry-soft)}
.m.now{outline:3px solid var(--rain);outline-offset:1px}

.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cat{flex:none;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:14px;display:flex;align-items:center;gap:4px}
.cat.on{border-color:var(--ink);background:var(--ink);color:var(--phone)}
.cat.done::after{content:"✓";color:var(--leaf);font-weight:700}
.cat.on.done::after{color:var(--maize)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:10px 4px 8px;display:grid;justify-items:center;gap:2px;position:relative;min-height:96px}
.card .ic{font-size:34px;line-height:1.1}
.card .lb{font-size:13px;line-height:1.2;text-align:center}
.card.picked{border-color:var(--leaf);background:var(--leaf-soft)}
.card .tag{position:absolute;top:-8px;right:-4px;background:var(--leaf);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:1px 7px;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .card .tag{color:#0F1A0E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card .tag{color:#0F1A0E}}

.board{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end}
.board .col{display:flex;flex-direction:column-reverse;align-items:center;gap:1px;min-height:44px;border-bottom:2px solid var(--line);padding-bottom:2px}
.board .pin{width:12px;height:12px;border-radius:50%;background:var(--sack);border:2px solid var(--phone)}
.board .pin.half{width:9px;height:9px}
.board .ml{font-size:10px;text-align:center;color:var(--muted)}
.boardlab{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}

.sheet{position:absolute;inset:auto 0 0 0;background:var(--phone);border-top:3px solid var(--maize);border-radius:22px 22px 0 0;padding:14px;display:grid;gap:10px;box-shadow:0 -12px 30px rgba(0,0,0,.18);z-index:5;max-height:88%;overflow-y:auto}
.sheet h3{margin:0;font-family:var(--display);font-size:22px;display:flex;align-items:center;gap:8px}
.scrim{position:absolute;inset:0;background:rgba(20,26,19,.35);z-index:4}

/* play */
.meter{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:150px;padding-top:14px;position:relative}
.meter .b{position:relative;height:100%;display:flex;align-items:flex-end}
.meter .b span{display:block;width:100%;background:var(--maize);border-radius:4px 4px 0 0;min-height:0;transition:height .35s ease}
.meter .b.low span{background:var(--hungry)}
.meter .b .v{position:absolute;left:0;right:0;text-align:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
.meter .b.hungry::after{content:"!";position:absolute;bottom:2px;left:0;right:0;text-align:center;font-weight:800;color:var(--hungry);font-size:16px}
.meter .b:hover span,.meter .b:focus span{outline:2px solid var(--ink)}
.meter-lab{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:10px;text-align:center;color:var(--muted);border-top:2px solid var(--line);padding-top:3px}
.tip{min-height:22px;font-size:14px;text-align:center;color:var(--ink2)}
.verdict{border-radius:16px;padding:12px;display:grid;gap:6px}
.verdict.bad{background:var(--hungry-soft)}
.verdict.good{background:var(--leaf-soft)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.vs div{background:var(--panel);border-radius:12px;padding:6px}
.vs .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.vs .v{font-family:var(--display);font-size:22px;font-weight:800}

.fixlist{display:grid;gap:6px}
.fx{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 8px}
.fx .ic{font-size:24px;text-align:center}
.fx .t{font-size:14px;line-height:1.25}
.fx .t small{color:var(--muted);display:block}
.fx .ctl{display:flex;gap:4px}
.fx .ctl button{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--phone);font-size:16px}

.plancard{border:3px dashed var(--sack);border-radius:18px;padding:10px;display:grid;gap:8px;background:var(--panel)}
.pc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pc{border-radius:12px;background:var(--phone);border:2px solid var(--line);padding:4px;text-align:center;display:grid;gap:0}
.pc .nm{font-size:12px;font-weight:700}
.pc .cnt{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.pc .it{font-size:14px;min-height:18px}
.pc.check{border-color:var(--leaf);background:var(--leaf-soft)}
.pc.hung{border-color:var(--hungry);background:var(--hungry-soft)}

.cover{position:absolute;inset:0;background:var(--phone);z-index:20;display:grid;place-items:center;text-align:center;padding:30px}
.cover .w{font-size:64px}
.cover p{color:var(--muted)}

.khoswe{display:inline-block}
@keyframes scurry{0%{transform:translateX(-30px);opacity:0}30%{opacity:1}100%{transform:translateX(0);opacity:1}}
.scurry{animation:scurry .8s ease-out}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.sacks svg:last-child{animation:drop .25s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{display:grid;justify-items:center}
.phone{height:min(780px, calc(100dvh - 40px))}
@media (max-width:440px){body{padding-inline:0;padding-block:0}.phone{border:none;border-radius:0;height:100dvh;max-width:none}}
</style>
</head>
<body>
<div class="phone" id="phone" aria-label="Bags Till Harvest">
  <div class="pbar">
    <div class="dots" id="dots"></div>
    <button class="iconbtn" id="soundBtn" title="Read aloud" aria-label="Read aloud">🔊</button>
  </div>
  <div class="guide">
    <svg class="face" viewBox="0 0 52 52" aria-hidden="true">
      <circle cx="26" cy="28" r="22" fill="var(--maize)"/>
      <path d="M26 4 C22 10 22 14 26 16 C30 14 30 10 26 4Z" fill="var(--leaf)"/>
      <circle cx="19" cy="26" r="3" fill="var(--ink)"/><circle cx="33" cy="26" r="3" fill="var(--ink)"/>
      <path d="M18 35 Q26 42 34 35" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="bubble" id="bubble"></div>
  </div>
  <div class="pbody" id="pbody"></div>
  <div class="pfoot" id="pfoot"></div>
</div>
<script>
(() => {
// ================= PHRASE BANK (English only for now) =================
// Every word the farmer sees lives here. {name} placeholders are filled in by t().
// To add a language later, copy this object and translate the values.
const PHRASES = {
  en: {
    next:"Next ▸", done:"Done ▸", back:"◀", bags:"bags", bag:"bag", bagsEachMoon:"bags each moon",
    empty:"empty", k:"K{n}",
    harvest_say:"Hello! Let's see if your maize lasts <b>until next harvest</b>. How many <b>bags</b> did you bring home?",
    harvest_unit:"bags of maize",
    harvest_sell:"Bags you <b>sell</b> for money stay in this pile for now. We will count what the money is for.",
    harvest_price:"1 bag sells for",
    newPlan:"✨ New plan", example:"👀 Example", exampleShown:"Example family shown.",
    guess_say:"Quick guess! <b>Before we count</b>: in which moon will the bags run out? Tap one. There is no wrong answer.",
    guess_lasts:"🌽 They will last until the next harvest",
    eat_say:"How much maize does your family <b>eat in one moon</b>? Count in bags. Half bags are fine.",
    eat_year:"Over 12 moons that is <b>{n} bags</b> for eating.",
    cat_school:"School", cat_home:"Home", cat_farm:"Farm", cat_people:"People", cat_surprise:"Surprises",
    say_school:"Now let's walk through the year. <b>School</b>: fees, uniforms, books… Tap each thing your family will pay for.",
    say_home:"<b>Home</b>: salt, soap, oil, grinding… the small things add up. Tap what you buy.",
    say_farm:"<b>Farm</b>: seed and fertiliser for next season. Hired help. Tap what you need.",
    say_people:"<b>People</b>: funerals, weddings, church, relatives who ask for help. Tap what might come.",
    say_surprise:"🐀 This is <b>Khoswe the rat</b>. He eats bags for things nobody plans, like the clinic or a broken bike. Keep some bags safe from him?",
    board:"Your year · each dot is a bag", keepSafe:"🐀 Keep-safe: {n} bags",
    sheet_which:"Which moon?", sheet_surprise:"🐀 No moon: these bags stay in the store, safe from Khoswe.",
    sheet_ok:"✓ Put it on the board",
    play_say:"Now watch your store, <b>one moon at a time</b>.", play_done_say:"That was your year. Let's look at it together.",
    play_btn:"▶ Play the year", play_again:"↻ Play again", play_tap:"Tap ▶ to play the year", play_tip:"Tap a bar to see the count",
    tip_left:"{m}: {n} bags left", tip_none:"{m}: no maize left",
    guessed:"You guessed", counted:"Counted", harvestWord:"Harvest",
    good:"🎉 The bags last until harvest!", good_spare:"{n} bags spare, plus {r} keep-safe.",
    bad:"The bags run out in <b>{m}</b>. That leaves <b>{h} hungry moons</b>.",
    bad_one:"The bags run out in <b>{m}</b>. That leaves <b>1 hungry moon</b>.",
    bad_comfort:"This is normal. Most families forget small costs. Let's fix it together.",
    fix_say:"Try changes: <b>smaller</b> (−), <b>earlier</b> (◀), <b>later</b> (▶). Watch the red moons.",
    fix_ok_say:"Your plan reaches harvest. You can still move things around.",
    fix_ok:"✓ Food until harvest", fix_short:"{h} hungry moons · short {n} bags",
    eating:"Eating", keepSafeRow:"Keep-safe from Khoswe", noCosts:"No costs added yet.",
    tooSmall:"If the harvest is too small, no plan can cover it. That is not your fault. <b>Ask your group leader about help.</b>",
    card_say:"Here is your plan. At the <b>green</b> moons, count your bags. If you have fewer, slow down before it's too late.",
    card_legend:"Big number = bags in store at the start of that moon, keep-safe bags included.",
    card_short:"Red moons: short {n} bags. Go back and fix, or ask for help.",
    startAgain:"↻ Start again", erase:"🗑️ Erase plan",
    months:["May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar","Apr"],
    items:{ fees:"School fees", uniform:"Uniform", shoes:"Shoes", books:"Books, pens", exam:"Exam fees", bus:"Travel to school",
      salt:"Salt, sugar", soap:"Soap", oil:"Cooking oil", light:"Paraffin, candles", mill:"Grinding", roof:"Roof, repairs",
      phone:"Phone talk-time", blanket:"Blankets", relish:"Relish, fish",
      seed:"Seed", fert:"Fertiliser", labour:"Hired help", tools:"Hoe, tools", store:"Sacks, storage", transport:"Transport",
      funeral:"Funeral", wedding:"Wedding", church:"Church, mosque", relatives:"Relatives ask", loan:"Loan to repay", group:"Savings group",
      sick:"Clinic", medicine:"Medicine", animal:"Animal dies", bike:"Something breaks", pests:"Pests, bad rain", other:"Something else" }
  }
};
let LANG = "en";
function t(key, vars={}){ const s = PHRASES[LANG][key] ?? PHRASES.en[key] ?? key; return String(s).replace(/\{(\w+)\}/g,(_,k)=>vars[k]??""); }
const mName = i => PHRASES[LANG].months[i];
const iName = id => PHRASES[LANG].items[id];

// ================= DATA (no words here) =================
const MONTH_IC = ["🌾","🌾","☀️","☀️","🎒","🔥","🌱","⭐","🎒","🌧️","🌧️","🌽"];
const CATS = [
  {id:"school", ic:"🎒", items:[["fees","🏫"],["uniform","👕"],["shoes","👟"],["books","✏️"],["exam","📝"],["bus","🚌"]]},
  {id:"home", ic:"🏠", items:[["salt","🧂"],["soap","🧼"],["oil","🛢️"],["light","🕯️"],["mill","⚙️"],["roof","🛖"],["phone","📱"],["blanket","🛏️"],["relish","🐟"]]},
  {id:"farm", ic:"🌱", items:[["seed","🌽"],["fert","🧪"],["labour","🧑‍🌾"],["tools","⛏️"],["store","🧺"],["transport","🚲"]]},
  {id:"people", ic:"👪", items:[["funeral","🕊️"],["wedding","💍"],["church","⛪"],["relatives","🤲"],["loan","💵"],["group","🪙"]]},
  {id:"surprise", ic:"🐀", surprise:true, items:[["sick","🏥"],["medicine","💊"],["animal","🐐"],["bike","🔧"],["pests","🐛"],["other","❔"]]}
];
const ITEM = {}; CATS.forEach(c=>c.items.forEach(([id,ic])=>ITEM[id]={id,ic,cat:c.id,surprise:!!c.surprise}));
const STEPS = ["harvest","guess","eat","remember","play","fix","card"];
const CHECKS = [5,7,9]; // Oct, Dec, Feb

function example(){ return { harvest:18, price:300, guess:10, eat:1.5, catIdx:0, catsDone:["school","home","farm","people","surprise"],
  picks:{ fees:{b:1,m:8}, uniform:{b:.5,m:8}, books:{b:.5,m:4}, salt:{b:.5,m:2}, soap:{b:.5,m:5}, mill:{b:.5,m:7},
    seed:{b:1,m:5}, fert:{b:2,m:6}, labour:{b:1,m:7}, funeral:{b:1,m:3}, church:{b:.5,m:7}, loan:{b:1,m:1}, sick:{b:1,m:null} },
  step:0, example:true }; }
function blank(){ return {harvest:0, price:300, guess:null, eat:1, catIdx:0, catsDone:[], picks:{}, step:0, example:false}; }
let S = example(), sheet = null, playing = null, playMonth = -1;

// ================= MODEL =================
const reserve = () => Object.entries(S.picks).filter(([k])=>ITEM[k].surprise).reduce((a,[,p])=>a+p.b,0);
const spendIn = m => Object.entries(S.picks).filter(([k,p])=>!ITEM[k].surprise && p.m===m).reduce((a,[,p])=>a+p.b,0);
function run(){
  let stock = S.harvest - reserve(); const out=[]; let runOut=null, hungry=0;
  for(let m=0;m<12;m++){ const start=stock; stock -= S.eat + spendIn(m); const low=stock<0;
    if(low){ if(runOut===null) runOut=m; hungry++; } out.push({start,end:stock,low}); }
  return {out, runOut, hungry, short:Math.max(0,-stock), end:stock};
}
const fmt = x => (Math.round(x*2)/2).toString().replace(".5","½").replace(/^0½/,"½");

// ================= VIEW HELPERS =================
const $ = s => document.querySelector(s);
const sackSvg = half => `<svg viewBox="0 0 30 34" aria-hidden="true"><path d="M8 6 L22 6 L20 10 C27 14 28 22 26 30 C22 33 8 33 4 30 C2 22 3 14 10 10Z" fill="var(--sack)" stroke="var(--sack-dk)" stroke-width="1.5" ${half?'opacity=".45"':''}/><path d="M9 6 Q15 2 21 6" stroke="var(--sack-dk)" stroke-width="2" fill="none"/><path d="M10 18 H20" stroke="var(--sack-dk)" stroke-width="1.5"/></svg>`;
const sacks = n => { let h=""; for(let i=1;i<=Math.floor(n);i++) h+=sackSvg(false); if(n%1) h+=sackSvg(true); return `<div class="sacks">${h||`<span class="small">${t("empty")}</span>`}</div>`; };
const stepper = (minus, plus, val, unit) => `<div class="stepper"><button data-a="${minus}" aria-label="less">−</button><div class="n">${val}</div><button data-a="${plus}" aria-label="more">+</button></div><div class="unit">${unit}</div>`;
const monthGrid = (cls, act) => `<div class="months">${MONTH_IC.map((ic,i)=>`<button class="m ${cls(i)}" data-a="${act}" data-i="${i}"><span class="ic">${ic}</span><span class="nm">${mName(i)}</span></button>`).join("")}</div>`;
const initials = () => `<div class="meter-lab">${MONTH_IC.map((_,i)=>`<span title="${mName(i)}">${mName(i)[0]}</span>`).join("")}</div>`;
const tip = (i,o) => o.low ? t("tip_none",{m:mName(i)}) : t("tip_left",{m:mName(i),n:fmt(o.end)});
const guessName = () => S.guess===12 ? t("harvestWord") : mName(S.guess);
function speak(s){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(s.replace(/<[^>]+>/g,"")); u.rate=.92; u.lang="en"; speechSynthesis.speak(u);}catch(e){} }

// ================= SCREENS =================
const SCREENS = {
  harvest: () => ({ say:t("harvest_say"), next:S.harvest>0, body:`
    <div class="granary">${sacks(S.harvest)}</div>${stepper("h-","h+",S.harvest,t("harvest_unit"))}
    <div class="small">${t("harvest_sell")}</div>
    <div class="money"><span aria-hidden="true">💵</span><span class="small" style="margin:0">${t("harvest_price")}</span>
      <button data-a="p-">−</button><span class="n">${t("k",{n:S.price})}</span><button data-a="p+">+</button></div>
    <div class="row">${S.example?`<span class="small">${t("exampleShown")}</span>`:""}<button class="cat" data-a="new">${t("newPlan")}</button><button class="cat" data-a="ex">${t("example")}</button></div>` }),

  guess: () => ({ say:t("guess_say"), next:S.guess!==null, body:`${monthGrid(i=>S.guess===i?"sel":"","g")}
    <button class="m ${S.guess===12?"sel":""}" data-a="g" data-i="12" style="min-height:48px"><span class="nm">${t("guess_lasts")}</span></button>` }),

  eat: () => ({ say:t("eat_say"), next:S.eat>0, body:`<div class="granary">${sacks(S.eat)}</div>${stepper("e-","e+",fmt(S.eat),t("bagsEachMoon"))}
    <div class="small">${t("eat_year",{n:fmt(S.eat*12)})}</div>` }),

  remember: () => { const c = CATS[S.catIdx]; return { say:t("say_"+c.id), next:true, nextLabel:S.catIdx<CATS.length-1?t("next"):t("done"), body:`
    <div class="cats">${CATS.map((k,i)=>`<button class="cat ${i===S.catIdx?"on":""} ${S.catsDone.includes(k.id)?"done":""}" data-a="cat" data-i="${i}">${k.ic} ${t("cat_"+k.id)}</button>`).join("")}</div>
    <div class="cards">${c.items.map(([id,ic])=>{const p=S.picks[id];return `<button class="card ${p?"picked":""}" data-a="item" data-id="${id}">${p?`<span class="tag">${fmt(p.b)}</span>`:""}<span class="ic">${ic}</span><span class="lb">${iName(id)}</span></button>`}).join("")}</div>
    <div><div class="small" style="text-align:left;margin-bottom:4px">${t("board")}</div>
      <div class="board">${MONTH_IC.map((_,i)=>{const s=spendIn(i);let pins="";for(let k=0;k<Math.floor(s);k++)pins+='<i class="pin"></i>';if(s%1)pins+='<i class="pin half"></i>';return `<div class="col" title="${mName(i)}">${pins}</div>`}).join("")}</div>
      ${initials()}${reserve()?`<div class="small" style="text-align:left">${t("keepSafe",{n:fmt(reserve())})}</div>`:""}</div>` }; },

  play: () => { const r=run(), done=playMonth>=11, base=Math.max(1,S.harvest);
    const bars = r.out.map((o,i)=>{ const vis=i<=playMonth, v=Math.max(0,o.end);
      const pct = vis ? Math.min(100,v/base*100) : Math.min(100,(S.harvest-reserve())/base*100);
      return `<div class="b ${vis&&o.low?"low hungry":""}" tabindex="0" data-tip="${vis?tip(i,o):mName(i)}"><span style="height:${pct}%"></span>${vis&&!o.low?`<em class="v" style="bottom:calc(${pct}% + 2px);font-style:normal">${fmt(v)}</em>`:""}</div>`; }).join("");
    const vs = c => `<div class="vs"><div><div class="k">${t("guessed")}</div><div class="v">${guessName()}</div></div><div><div class="k">${t("counted")}</div><div class="v">${c}</div></div></div>`;
    const verdict = !done ? "" : r.runOut===null
      ? `<div class="verdict good"><b>${t("good")}</b>${vs("🌽 "+t("harvestWord"))}<span class="small">${t("good_spare",{n:fmt(r.end),r:fmt(reserve())})}</span></div>`
      : `<div class="verdict bad"><span>${t(r.hungry===1?"bad_one":"bad",{m:mName(r.runOut),h:r.hungry})}</span>${vs(mName(r.runOut))}<span class="small">${t("bad_comfort")}</span></div>`;
    return { say:done?t("play_done_say"):t("play_say"), next:done, body:`
      <div class="meter">${bars}</div>${initials()}
      <div class="tip" id="tip">${playMonth<0?t("play_tap"):t("play_tip")}</div>${verdict}
      ${done?`<button class="cat" data-a="play" style="align-self:center">${t("play_again")}</button>`:`<button class="big go" data-a="play" style="flex:none">${t("play_btn")}</button>`}` }; },

  fix: () => { const r=run(), base=Math.max(1,S.harvest);
    const bars = r.out.map((o,i)=>{const pct=Math.min(100,Math.max(0,o.end)/base*100);return `<div class="b ${o.low?"low hungry":""}" tabindex="0" data-tip="${tip(i,o)}"><span style="height:${pct}%"></span></div>`}).join("");
    const row = (ic,label,sub,minus,plus,id="") => `<div class="fx"><span class="ic">${ic}</span><span class="t">${label}<small>${sub}</small></span><span class="ctl">${minus}${plus}</span></div>`;
    const btn = (a,l,id="") => `<button data-a="${a}" ${id?`data-id="${id}"`:""}>${l}</button>`;
    const items = Object.entries(S.picks).filter(([k])=>!ITEM[k].surprise).sort((a,b)=>a[1].m-b[1].m)
      .map(([k,p])=>row(ITEM[k].ic, iName(k), `${fmt(p.b)} ${p.b>1?t("bags"):t("bag")} · ${mName(p.m)}`, btn("fx-","−",k), btn("fx<","◀",k)+btn("fx>","▶",k))).join("");
    return { say:r.runOut===null?t("fix_ok_say"):t("fix_say"), next:true, body:`
      <div class="meter" style="height:96px">${bars}</div>${initials()}
      <div class="tip" id="tip">${r.runOut===null?t("fix_ok"):t("fix_short",{h:r.hungry,n:fmt(r.short)})}</div>
      ${row("🍲",t("eating"),`${fmt(S.eat)} ${t("bagsEachMoon")}`,btn("e-","−"),btn("e+","+"))}
      ${row("🐀",t("keepSafeRow"),`${fmt(reserve())} ${t("bags")}`,btn("r-","−"),btn("r+","+"))}
      <div class="fixlist">${items||`<span class="small">${t("noCosts")}</span>`}</div>
      ${r.short>0?`<div class="verdict bad small" style="text-align:left">${t("tooSmall")}</div>`:""}` }; },

  card: () => { const r=run(); return { say:t("card_say"), next:false, body:`
    <div class="plancard"><div class="pc-grid">${r.out.map((o,i)=>`<div class="pc ${CHECKS.includes(i)&&!o.low?"check":""} ${o.low?"hung":""}"><span class="nm">${MONTH_IC[i]} ${mName(i)}</span><span class="cnt">${fmt(Math.max(0,o.start)+reserve())}</span><span class="it">${Object.entries(S.picks).filter(([k,p])=>p.m===i&&!ITEM[k].surprise).map(([k])=>ITEM[k].ic).join("")}</span></div>`).join("")}</div>
      ${r.short>0?`<div class="small" style="color:var(--hungry);font-weight:700">${t("card_short",{n:fmt(r.short)})}</div>`:""}
      <div class="small">${t("card_legend")}</div></div>
    <div class="row"><button class="cat" data-a="erase">${t("erase")}</button><button class="cat" data-a="restart">${t("startAgain")}</button></div>` }; }
};

// ================= RENDER =================
function render(){
  const sc = SCREENS[STEPS[S.step]]();
  $("#dots").innerHTML = STEPS.map((_,i)=>`<i class="${i<S.step?"done":i===S.step?"on":""}"></i>`).join("");
  $("#bubble").innerHTML = sc.say;
  $("#pbody").innerHTML = sc.body;
  $("#pfoot").innerHTML = (S.step>0?`<button class="big back" data-a="back" aria-label="back">${t("back")}</button>`:"")
    + (STEPS[S.step]==="card" ? "" : `<button class="big go" data-a="next" ${sc.next?"":'disabled style="opacity:.45"'}>${sc.nextLabel||t("next")}</button>`);
  $("#phone").querySelectorAll(".sheet,.scrim").forEach(e=>e.remove());
  if(sheet) $("#phone").insertAdjacentHTML("beforeend", sheetHtml());
  $("#phone").dataset.say = sc.say;
}
function sheetHtml(){
  const it = ITEM[sheet.id];
  return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog">
    <h3><span style="font-size:34px">${it.ic}</span>${iName(it.id)}</h3>
    ${stepper("s-","s+",fmt(sheet.b), t("bags")+(S.price?" · "+t("k",{n:Math.round(sheet.b*S.price)}):""))}
    ${it.surprise?`<div class="small">${t("sheet_surprise")}</div>`:`<div class="small">${t("sheet_which")}</div>${monthGrid(i=>sheet.m===i?"sel":"","sm")}`}
    <div class="pfoot" style="padding:0;border:none">${sheet.had?`<button class="big back" data-a="sdel" aria-label="remove">🗑️</button>`:""}
      <button class="big go" data-a="sok" ${!it.surprise&&sheet.m===null?'disabled style="opacity:.45"':""}>${t("sheet_ok")}</button></div></div>`;
}

// ================= ACTIONS =================
const markDone = () => { const id=CATS[S.catIdx].id; if(!S.catsDone.includes(id)) S.catsDone.push(id); };
function startPlay(){
  clearInterval(playing); playMonth=-1;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ playMonth=11; render(); return; }
  playing = setInterval(()=>{ playMonth++; render(); if(playMonth>=11) clearInterval(playing); }, 520);
}
const ACTIONS = {
  "h+":()=>S.harvest=Math.min(60,S.harvest+1), "h-":()=>S.harvest=Math.max(0,S.harvest-1),
  "p+":()=>S.price=Math.min(2000,S.price+25), "p-":()=>S.price=Math.max(0,S.price-25),
  "new":()=>S=blank(), "ex":()=>S=example(), "erase":()=>S=blank(), "restart":()=>{S.step=0;playMonth=-1;},
  "g":el=>S.guess=+el.dataset.i,
  "e+":()=>S.eat=Math.min(6,S.eat+.5), "e-":()=>S.eat=Math.max(.5,S.eat-.5),
  "cat":el=>{markDone(); S.catIdx=+el.dataset.i;},
  "item":el=>{const p=S.picks[el.dataset.id]; sheet={id:el.dataset.id, b:p?p.b:1, m:p?p.m:null, had:!!p};},
  "s+":()=>sheet.b=Math.min(20,sheet.b+.5), "s-":()=>sheet.b=Math.max(.5,sheet.b-.5),
  "sm":el=>sheet.m=+el.dataset.i,
  "sok":()=>{ if(ITEM[sheet.id].surprise||sheet.m!==null){ S.picks[sheet.id]={b:sheet.b,m:sheet.m}; sheet=null; } },
  "sdel":()=>{ delete S.picks[sheet.id]; sheet=null; }, "close":()=>sheet=null,
  "fx-":el=>{ const p=S.picks[el.dataset.id]; p.b-=.5; if(p.b<=0) delete S.picks[el.dataset.id]; },
  "fx<":el=>{ const p=S.picks[el.dataset.id]; p.m=Math.max(0,p.m-1); },
  "fx>":el=>{ const p=S.picks[el.dataset.id]; p.m=Math.min(11,p.m+1); },
  "r+":()=>{ const k=Object.keys(S.picks).find(k=>ITEM[k].surprise)||"other"; S.picks[k]={b:(S.picks[k]?.b||0)+.5,m:null}; },
  "r-":()=>{ const k=Object.keys(S.picks).find(k=>ITEM[k].surprise); if(k){ S.picks[k].b-=.5; if(S.picks[k].b<=0) delete S.picks[k]; } },
  "next":()=>{ if(STEPS[S.step]==="remember"){ markDone(); if(S.catIdx<CATS.length-1){ S.catIdx++; return; } }
    S.step=Math.min(STEPS.length-1,S.step+1); if(STEPS[S.step]==="play") playMonth=-1; },
  "back":()=>{ if(STEPS[S.step]==="remember" && S.catIdx>0){ S.catIdx--; return; } clearInterval(playing); S.step=Math.max(0,S.step-1); },
  "play":()=>{ startPlay(); return "skip"; }
};
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-a]"); if(!b || b.disabled) return;
  const f = ACTIONS[b.dataset.a]; if(f && f(b)==="skip") return; render();
});
const showTip = e => { const b=e.target.closest(".meter .b"); if(b && $("#tip")) $("#tip").textContent=b.dataset.tip; };
document.addEventListener("pointerover", showTip); document.addEventListener("focusin", showTip);
$("#soundBtn").addEventListener("click", ()=>speak($("#phone").dataset.say));
render();
})();
</script>
</body>
</html>
