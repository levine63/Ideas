<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bags Till Harvest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --ground:#EFE6D2; --phone:#FFFCF4; --panel:#FBF6E9; --chip:#F3ECDA;
  --ink:#1E2A1B; --ink2:#3F4A3A; --muted:#57594C; --line:#B5AC96;
  --maize:#E9A800; --maize-soft:#FBE7B0; --sack:#B07F45; --sack-dk:#7A5428; --soil:#9A6A42; --thatch:#C9A25A;
  --leaf:#2F6B34; --leaf-soft:#D5E6CF; --on-leaf:#FFFFFF; --hungry:#B3402A; --hungry-soft:#F6D6CC;
  --rain:#2F5F93; --dry:#EAD7A4; --hot:#E9A15B; --rain-soft:#BFD8EC; --phone-edge:#2A2418;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F120B; --phone:#15170F; --panel:#20231A; --chip:#262A1E;
    --ink:#EDEFE4; --ink2:#C9CFBD; --muted:#A4AD99; --line:#4A5040;
    --maize:#F2B92A; --maize-soft:#4A3C12; --sack:#C79A5F; --sack-dk:#E6C08A; --soil:#B98A5E; --thatch:#8E7440;
    --leaf:#7DBB73; --leaf-soft:#233A22; --on-leaf:#0F1A0E; --hungry:#EE7A62; --hungry-soft:#4A2219;
    --rain:#8DB6E4; --dry:#5A4A22; --hot:#7A4A22; --rain-soft:#23405C; --phone-edge:#3A3A2C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F120B; --phone:#15170F; --panel:#20231A; --chip:#262A1E;
  --ink:#EDEFE4; --ink2:#C9CFBD; --muted:#A4AD99; --line:#4A5040;
  --maize:#F2B92A; --maize-soft:#4A3C12; --sack:#C79A5F; --sack-dk:#E6C08A; --soil:#B98A5E; --thatch:#8E7440;
  --leaf:#7DBB73; --leaf-soft:#233A22; --on-leaf:#0F1A0E; --hungry:#EE7A62; --hungry-soft:#4A2219;
  --rain:#8DB6E4; --dry:#5A4A22; --hot:#7A4A22; --rain-soft:#23405C; --phone-edge:#3A3A2C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-inline:16px;padding-block:20px;display:grid;justify-items:center;align-items:start}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--rain);outline-offset:2px}

/* ---------- phone shell ---------- */
.phone{width:100%;max-width:400px;background:var(--phone);border:10px solid var(--phone-edge);border-radius:34px;
  height:min(800px, calc(100dvh - 40px));display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (max-width:440px){body{padding:0}.phone{border:none;border-radius:0;height:100dvh;max-width:none}}
.pbar{display:flex;align-items:center;gap:10px;padding:10px 12px 4px}
.dots{display:flex;gap:5px;flex:1}
.dots i{height:8px;flex:1;border-radius:4px;background:var(--line);opacity:.6}
.dots i.on{background:var(--maize);opacity:1}
.dots i.done{background:var(--leaf);opacity:1}
.speak{width:52px;height:52px;border-radius:50%;border:none;background:var(--maize);display:grid;place-items:center;font-size:24px;box-shadow:0 2px 0 var(--sack-dk)}
.speak:active{transform:translateY(2px);box-shadow:none}

.guide{display:flex;gap:8px;align-items:flex-start;padding:4px 14px 10px}
.guide .face{flex:none;width:56px;height:64px}
.bubble{position:relative;background:var(--maize-soft);border-radius:18px;padding:10px 14px;font-size:18px;line-height:1.35;flex:1;min-height:56px}
.bubble::before{content:"";position:absolute;left:-9px;top:20px;border:10px solid transparent;border-right-color:var(--maize-soft);border-left:0}
.bubble b{font-weight:700}
.bubble .chipi{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--phone);font-size:15px;vertical-align:middle;margin:0 1px}

.pbody{flex:1;overflow-y:auto;padding:4px 14px 16px;display:flex;flex-direction:column;gap:12px}
.pbody>*{flex-shrink:0}
.pfoot{display:flex;gap:10px;padding:10px 14px 14px;border-top:2px solid var(--chip);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.big{flex:1;min-height:60px;border-radius:18px;border:none;font-family:var(--display);font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 rgb(0 0 0/.18)}
.big:active{transform:translateY(3px);box-shadow:none}
.big.go{background:var(--leaf);color:var(--on-leaf)}
.big.go[aria-disabled="true"]{opacity:.5}
.big.back{flex:0 0 64px;background:var(--chip);box-shadow:0 3px 0 var(--line)}
.big.gold{background:var(--maize);color:#2A1E00}

/* ---------- shared pieces ---------- */
.small{font-size:15px;color:var(--ink2);text-align:center}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.pill{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.pill.strong{border-color:var(--sack);background:var(--maize-soft);font-weight:700}
.banner{background:var(--maize-soft);border:2px dashed var(--sack);border-radius:14px;padding:8px 12px;font-size:15px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.banner button{border:none;background:none;font-weight:700;text-decoration:underline;padding:6px}

.stepper{display:flex;align-items:center;justify-content:center;gap:16px}
.stepper button{width:68px;height:68px;border-radius:50%;border:3px solid var(--sack);background:var(--panel);font-size:34px;font-weight:700;line-height:1;box-shadow:0 3px 0 var(--sack-dk)}
.stepper button:active{transform:translateY(3px);box-shadow:none}
.stepper button[aria-disabled="true"]{opacity:.35;box-shadow:none}
.fx .ctl button[aria-disabled="true"]{opacity:.35}
.stepper .n{font-family:var(--display);font-size:52px;font-weight:800;min-width:100px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.unit{text-align:center;color:var(--ink2);font-size:16px;margin-top:-6px}

.store-row{display:flex;align-items:flex-end;justify-content:center;gap:12px}
.granary{width:120px;height:120px;flex:none}
.granary .lvl{transition:y .45s ease, height .45s ease}
.sacks{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:flex-end;min-height:40px;max-width:230px}
.sacks .s{width:30px;height:34px;position:relative}
.sacks .s.ten{width:40px;height:44px}
.sacks .s.ten b{position:absolute;inset:14px 0 0;text-align:center;font-family:var(--display);font-size:14px;color:#fff;text-shadow:0 1px 0 var(--sack-dk)}

.moons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.m{border:2px solid var(--line);border-top-width:6px;background:var(--panel);border-radius:12px;padding:6px 2px 6px;display:grid;justify-items:center;align-content:center;gap:0;min-height:64px}
.m .ic{font-size:20px;line-height:1.1}
.m .nm{font-size:14px;font-weight:700}
.m.sel{border-color:var(--sack-dk);background:var(--maize-soft);box-shadow:0 0 0 3px var(--maize) inset}
.m.wide{grid-column:1/-1;min-height:52px;border-top-width:2px}
.s-dry{border-top-color:var(--dry)}.s-hot{border-top-color:var(--hot)}.s-rain{border-top-color:var(--rain-soft)}.s-harv{border-top-color:var(--maize)}
.m.sel.s-dry,.m.sel.s-hot,.m.sel.s-rain,.m.sel.s-harv{border-top-color:var(--sack-dk)}
.nudge{animation:nudge .45s}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.band{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.band span{height:6px;border-radius:3px}
.band .s-dry{background:var(--dry)}.band .s-hot{background:var(--hot)}.band .s-rain{background:var(--rain-soft)}.band .s-harv{background:var(--maize)}
.mlab{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;font-size:11px;white-space:nowrap;text-align:center;color:var(--ink2);font-weight:700;letter-spacing:-.02em}
.legend{display:flex;justify-content:center;gap:14px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:4px;vertical-align:middle}

/* remember */
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:15px;min-height:44px;display:flex;align-items:center;gap:5px}
.cat.on{border-color:var(--ink);background:var(--ink);color:var(--phone);font-weight:700}
.cat.done::after{content:"✓";color:var(--leaf);font-weight:800}
.cat.on.done::after{color:var(--maize)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:10px 4px 8px;display:grid;justify-items:center;gap:2px;position:relative;min-height:98px;box-shadow:0 3px 0 var(--chip)}
.card:active{transform:translateY(2px)}
.card .ic{font-size:36px;line-height:1.1}
.card .lb{font-size:14px;line-height:1.2;text-align:center}
.card.picked{border-color:var(--leaf);background:var(--leaf-soft)}
.card .tag{position:absolute;top:-9px;right:-5px;background:var(--leaf);color:var(--on-leaf);border-radius:999px;font-size:13px;font-weight:700;padding:1px 8px;font-variant-numeric:tabular-nums}
.boardwrap{background:var(--panel);border-radius:16px;padding:10px 8px 8px;display:grid;gap:4px;position:relative;overflow:hidden}
.boardwrap .ttl{font-size:14px;color:var(--ink2);font-weight:700}
.board{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;border-bottom:3px solid var(--soil);min-height:52px}
.board .col{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;padding-bottom:2px}
.board .pin{width:14px;height:12px;border-radius:5px 5px 3px 3px;background:var(--sack);border:1.5px solid var(--sack-dk)}
.board .pin.half{height:7px}
.board .pin.tiny{height:4px;width:10px;opacity:.8}
.ppl{letter-spacing:-3px;font-size:14px}
.rat{position:absolute;right:8px;top:6px;font-size:22px}
.ratdash{position:absolute;left:0;right:0;top:34%;z-index:6;pointer-events:none;display:flex;justify-content:center}
.ratdash span{font-size:92px;line-height:1;filter:drop-shadow(0 6px 4px rgb(0 0 0/.25));animation:ratfade 2.2s forwards}
@keyframes ratfade{0%,75%{opacity:1}100%{opacity:0}}
.keepsafe{font-size:14px;color:var(--ink2);display:flex;gap:6px;align-items:center}

.sheet{position:absolute;inset:auto 0 0 0;background:var(--phone);border-top:4px solid var(--maize);border-radius:24px 24px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;box-shadow:0 -12px 30px rgb(0 0 0/.22);z-index:5;max-height:90%;overflow-y:auto}
.sheet h3{margin:0;font-family:var(--display);font-size:24px;display:flex;align-items:center;gap:8px}
.sheet .x{margin-left:auto;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:18px}
.scrim{position:absolute;inset:0;background:rgb(20 20 10/.4);z-index:4}

/* play + fix meter */
.meter{--mh:140px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;align-items:end;height:var(--mh);padding-top:22px;border-bottom:3px solid var(--soil)}
.meter .b{position:relative;height:100%;display:flex;align-items:flex-end;border-radius:4px 4px 0 0}
.meter .b span{display:block;width:100%;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2010%22%20preserveAspectRatio%3D%22none%22%3E%3Crect%20x%3D%221%22%20y%3D%221.2%22%20width%3D%2222%22%20height%3D%227.8%22%20rx%3D%223.9%22%20fill%3D%22%23B07F45%22%20stroke%3D%22%236E4A22%22%20stroke-width%3D%221.2%22/%3E%3Cpath%20d%3D%22M5.5%201.6%20V8.6%22%20stroke%3D%22%236E4A22%22%20stroke-width%3D%221.1%22/%3E%3C/svg%3E") left bottom / 100% var(--slot) repeat-y;transition:height .35s ease}
.meter .b.low{background:var(--hungry-soft)}
.meter .b.low span{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2010%22%20preserveAspectRatio%3D%22none%22%3E%3Crect%20x%3D%221%22%20y%3D%221.2%22%20width%3D%2222%22%20height%3D%227.8%22%20rx%3D%223.9%22%20fill%3D%22%23D0735C%22%20stroke%3D%22%238A2E1C%22%20stroke-width%3D%221.2%22/%3E%3Cpath%20d%3D%22M5.5%201.6%20V8.6%22%20stroke%3D%22%238A2E1C%22%20stroke-width%3D%221.1%22/%3E%3C/svg%3E")}
.meter .b.fut{background:repeating-linear-gradient(0deg,transparent 0 8px,var(--chip) 8px 10px);opacity:.7}
.meter .b.fut span{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2010%22%20preserveAspectRatio%3D%22none%22%3E%3Crect%20x%3D%221%22%20y%3D%221.2%22%20width%3D%2222%22%20height%3D%227.8%22%20rx%3D%223.9%22%20fill%3D%22%23D6CFBD%22%20stroke%3D%22%23ABA38D%22%20stroke-width%3D%221.2%22/%3E%3Cpath%20d%3D%22M5.5%201.6%20V8.6%22%20stroke%3D%22%23ABA38D%22%20stroke-width%3D%221.1%22/%3E%3C/svg%3E")}
.meter .b.now{box-shadow:0 0 0 2px var(--ink)}
.meter .b .v{position:absolute;left:-2px;right:-2px;text-align:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);font-style:normal}
.meter .b.low::after{content:"!";position:absolute;bottom:2px;left:0;right:0;text-align:center;font-weight:800;color:var(--hungry);font-size:16px}
.meter .b.low span + .v{display:none}
.bagkey{font-size:13px;color:var(--ink2);text-align:right;margin-top:-4px}
.tip{min-height:24px;font-size:15px;text-align:center;color:var(--ink2);font-weight:700}
.playrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:end}
.playrow .granary{width:64px;height:64px}
.playrow .mlab{font-size:10px;letter-spacing:-.04em}
.playrow>div{min-width:0}

.verdict{border-radius:18px;padding:12px;display:grid;gap:8px;font-size:17px;
  background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgb(0 0 0/.03) 6px 7px)}
.verdict.bad{background-color:var(--hungry-soft)}
.verdict.good{background-color:var(--leaf-soft)}
.cutlist{margin:0;padding-left:20px;display:grid;gap:2px}
.verdict.quiet{background-color:var(--panel);border:2px solid var(--line)}
.verdict .note{font-size:15px;color:var(--ink)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.vs div{background:var(--phone);border-radius:12px;padding:6px}
.vs .k{font-size:13px;color:var(--ink2);font-weight:700}
.vs .v{font-family:var(--display);font-size:24px;font-weight:800}
.burst{position:relative;height:0}
.burst i{position:absolute;left:50%;top:-20px;width:10px;height:12px;border-radius:50%;background:var(--maize);border:1.5px solid var(--sack-dk)}

/* fix */
.fixlist{display:grid;gap:6px}
.fx{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 8px}
.fx.red{border-color:var(--hungry);background:var(--hungry-soft)}
.fx .ic{font-size:26px;text-align:center}
.fx .t{font-size:15px;line-height:1.25}
.fx .t small{color:var(--ink2);display:block;font-size:13px}
.fx .ctl{display:flex;gap:6px}
.fx .ctl button{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--phone);font-size:17px;display:grid;place-items:center;line-height:1;padding:0}
.fx .ctl button small{display:block;font-size:9px;color:var(--ink2);margin-top:1px}
.flash{animation:flash .6s}
@keyframes flash{0%{background:var(--leaf-soft)}100%{}}
.eatnote{font-size:14px;color:var(--ink2);padding:0 4px}

/* family + nudges + party */
.fam{display:grid;gap:6px}
.fam .fx{grid-template-columns:36px 1fr auto;padding:4px 8px}
.famn{font-family:var(--display);font-size:24px;min-width:34px;text-align:center;align-self:center;font-variant-numeric:tabular-nums}
.nudgecard{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--maize-soft);border:2px solid var(--sack);border-radius:16px;padding:10px}
.party{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.party i{position:absolute;top:-50px;left:var(--x);font-style:normal;font-size:calc(26px * var(--s));display:none}
.party .ban{position:absolute;top:32%;left:6%;right:6%;background:var(--maize);color:#2A1E00;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;text-align:center;border-radius:22px;padding:18px 12px;box-shadow:0 6px 0 var(--sack-dk),0 16px 30px rgb(0 0 0/.25);border:3px solid var(--sack-dk);animation:banout .4s 3s forwards}
@keyframes banout{to{opacity:0}}

/* card */
.plancard{border:3px dashed var(--sack);border-radius:18px;padding:10px;display:grid;gap:8px;background-color:var(--panel);
  background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgb(0 0 0/.03) 6px 7px)}
.pc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pc{border-radius:12px;background:var(--phone);border:2px solid var(--line);border-top-width:6px;padding:4px 2px;text-align:center;display:grid;position:relative}
.pc .nm{font-size:13px;font-weight:700}
.pc .cnt{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.pc .it{font-size:14px;min-height:18px}
.pc.low{background:var(--hungry-soft)}
.pc.low .cnt{color:var(--hungry)}
.pc.check{box-shadow:0 0 0 3px var(--leaf)}
.pc.check::after{content:"✓";position:absolute;top:-10px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--leaf);color:var(--on-leaf);font-weight:800;font-size:13px;display:grid;place-items:center}
.pc.check.low{box-shadow:0 0 0 3px var(--hungry)}
.pc.check.low::after{background:var(--hungry)}
.pc.harv{box-shadow:0 0 0 3px var(--maize)}
.remind{display:grid;gap:8px;justify-items:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px}
a.pill{color:var(--ink);text-decoration:none}
.cardnote{font-size:15px;text-align:center}
.cardnote.bad{color:var(--hungry);font-weight:700}
.toast{background:var(--ink);color:var(--phone);border-radius:14px;padding:10px 12px;font-size:15px;text-align:center}

/* ---------- motion (only when allowed) ---------- */
@media (prefers-reduced-motion: no-preference){
  .sacks .s.new{animation:drop .25s ease-out}
  @keyframes drop{0%{transform:translateY(-16px);opacity:0}80%{transform:translateY(0) scaleY(.94)}100%{transform:none;opacity:1}}
  .speak.hello{animation:pulse 1.2s 2}
  @keyframes pulse{50%{box-shadow:0 0 0 10px rgb(233 168 0/.25)}}
  .rat.run{animation:scurry 1s 1.8s ease-out backwards}
  .ratdash span{animation:ratdash 2.2s ease-in-out forwards}
  @keyframes ratdash{0%{transform:translateX(-120vw) scaleX(-1)}30%{transform:translateX(0) scaleX(-1)}40%{transform:translateX(0) scaleX(-1) rotate(-8deg)}50%{transform:translateX(0) scaleX(-1) rotate(6deg)}62%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(120vw) scaleX(-1)}}
  @keyframes scurry{0%{transform:translateX(-300px) scaleX(-1)}70%{transform:translateX(10px) scaleX(-1)}100%{transform:none}}
  .burst i{animation:pop .8s ease-out forwards}
  @keyframes pop{from{transform:translate(-50%,0) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(1);opacity:0}}
  .face .blink{animation:blink 4s infinite}

let LANG = "en";

// ================= DATA (no words here) =================

  {id:"people", ic:"👪", items:[["wedding","💍"],["church","⛪"],["relatives","🤲"],["loan","📒"],["group","🪙"]]},
  {id:"surprise", ic:"🐀", surprise:true, items:[["sick","🏥"],["medicine","💊"],["funeral","🕊️"],["animal","🐐"],["bike","🔧"],["other","❔"]]}
];
const ITEM = {}; CATS.forEach(c=>c.items.forEach(([id,ic])=>ITEM[id]={id,ic,cat:c.id,surprise:!!c.surprise}));
const STEPS = ["harvest","guess","eat","remember","play","fix","card"];
const CHECKS = [3,6,9]; // Aug, Nov, Feb: every three months after harvest
const ALL = "all";       // a cost spread evenly over the 12 moons; its amount is for the whole year
const SPREAD_BY_DEFAULT = ["home"];

// Deployer switches and food benchmark.
// PROTOTYPE ASSUMPTION, not validated: 150 kg maize per person per year (household average,
// adults and children together) = 0.25 of a 50 kg bag a moon. Replace with a locally checked figure.
// This check tells families what is typical, which is outside information; turn it off for a pure-recall study arm.
const CHECK = { food:true, school:true, keepSafe:true };
// Calendar reminders put the family's bag numbers into a phone calendar. Turn them off on a
// presenter's or shared device by opening the page with ?reminders=off (or set this to false).
const FEATURES = { reminders: !/[?&]reminders=off\b/.test(location.search) };
const FOOD = { kgPerPersonYear:150, bagKg:50, askBelow:.75 };
const typicalEat = () => S.people * FOOD.kgPerPersonYear / 12 / FOOD.bagKg;
// A plan that only lasts because eating went below the family's first answer gets no party.
// "First list" = costs and keep-safe when the family first leaves the cost walk. Moving a cost is fine;
// cutting eating, keep-safe, or any first-list cost means the plan only lasts after cuts: no party.
function cuts(){ const out=[];
  if(S.eat0!==null && S.eat<S.eat0) out.push("🍲 "+t("cut_eat",{a:nb(S.eat0),b:nb(S.eat)}));
  if(S.first){ if(reserve()<S.first.reserve-1e-9) out.push("🐀 "+t("keepSafeShort"));
    for(const [k,p] of Object.entries(S.first.picks)) if(!ITEM[k].surprise && (!S.picks[k] || S.picks[k].b<p.b-1e-9)) out.push(ITEM[k].ic+" "+iName(k)); }
  return out; }
const eatCut = () => cuts().length>0;
const suggestEat = () => Math.max(.5, Math.ceil(typicalEat()*2)/2);
const FACE_FOR = {harvest:"happy", guess:"think", eat:"happy", remember:"think", play:"think", fix:"think", card:"happy"};

function example(){ return { harvest:18, price:300, guess:10, eat:1.5, eat0:1.5, people:6, asked:{}, catIdx:0, catsDone:[], picks:{}, first:null,
  exPicks:{ fees:{b:1,m:8}, uniform:{b:.5,m:8}, books:{b:.5,m:4}, salt:{b:1,m:ALL}, soap:{b:.5,m:ALL}, mill:{b:1,m:ALL},
    seed:{b:1,m:5}, fert:{b:2,m:6}, labour:{b:1,m:7}, church:{b:.5,m:7}, loan:{b:1,m:1}, sick:{b:1,m:null}, funeral:{b:1,m:null} },
  step:0, example:true, showPrice:true }; }
function blank(){ return {harvest:0, price:300, guess:null, eat:1, eat0:null, people:0, asked:{}, catIdx:0, catsDone:[], picks:{}, step:0, example:false, showPrice:false}; }
let S = blank(), sheet = null, playing = null, playMonth = -1, ui = {}, nudge = null;

// ================= MODEL =================
const reserve = () => Object.entries(S.picks).filter(([k])=>ITEM[k].surprise).reduce((a,[,p])=>a+p.b,0);
const spendIn = m => Object.entries(S.picks).filter(([k])=>!ITEM[k].surprise).reduce((a,[,p])=>a+(p.m===m?p.b:p.m===ALL?p.b/12:0),0);
// For each moon: bags in the store at the START (not counting keep-safe), and whether the moon runs short.
function run(){
  let stock = S.harvest - reserve(); const out=[]; let runOut=null, hungry=0;
  for(let m=0;m<12;m++){ const start=stock; stock -= S.eat + spendIn(m); const low=stock<0;
    if(low){ if(runOut===null) runOut=m; hungry++; } out.push({start:Math.max(0,start), low}); }
  return {out, runOut, hungry, short:runOut===null?0:Math.max(.5,Math.ceil(-stock*2-1e-9)/2), end:stock};
}
function fmt(x){ const r=Math.round(x*2)/2, w=Math.floor(r); return r%1 ? (w?w+"½":"½") : String(w); }

// ================= DRAWING =================
const $ = s => document.querySelector(s);
const SACK = `<path d="M8 6 L22 6 L20 10 C27 14 28 22 26 30 C22 33 8 33 4 30 C2 22 3 14 10 10Z"/>`;
function sack(kind, isNew){
  const id = "h"+Math.random().toString(36).slice(2,7);
  if(kind==="half") return `<svg class="s ${isNew?"new":""}" viewBox="0 0 30 34" aria-hidden="true"><defs><clipPath id="${id}"><rect x="0" y="18" width="30" height="16"/></clipPath></defs>

  return `<svg class="s ${kind==="ten"?"ten":""} ${isNew?"new":""}" viewBox="0 0 30 34" aria-hidden="true"><g fill="var(--sack)" stroke="var(--sack-dk)" stroke-width="1.5">${SACK}</g>

}
function sacks(n, animateLast){
  if(n<=0) return `<div class="sacks"><span class="small">${t("empty")}</span></div>`;
  const tens=Math.floor(n/10), ones=Math.floor(n%10), half=n%1; let h="";
  for(let i=0;i<tens;i++) h+=sack("ten");
  for(let i=0;i<ones;i++) h+=sack("one", animateLast && !half && i===ones-1);
  if(half) h+=sack("half", animateLast);
  return `<div class="sacks" aria-label="${nb(n)}">${h}</div>`;
}
// Round mud granary on stilts (nkokwe). frac = how full, 0..1
function granary(frac, cls=""){
  frac = Math.max(0, Math.min(1, frac)); const top=40, bot=100, y = bot - (bot-top)*frac;
  return `<svg class="granary ${cls}" viewBox="0 0 120 120" aria-hidden="true">

function face(mood){

    ? `<path d="M19 30 L25 28 M37 28 L43 30" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><g class="blink" style="transform-origin:31px 34px"><circle cx="23" cy="34" r="3" fill="var(--ink)"/><circle cx="39" cy="34" r="3" fill="var(--ink)"/></g>`

const bagKey = () => bagUnit()>1 ? `<div class="bagkey">${t("bagkey",{n:bagUnit()})}</div>` : "";

// ================= SCREENS =================

  play: () => { const r=run(), done=playMonth>=11, shown=Math.max(-1,playMonth);

    return { say:done?(r.runOut===null?(eatCut()?t("cut_say"):t("play_done_good")):t("play_done_bad")):t("play_say"), mood: done ? (r.runOut===null&&!eatCut()?"happy":"think") : "think", next:done, body:`
      <div class="playrow">${granary(cur)}<div><div class="meter" style="${meterStyle()}">${bars(r, shown)}</div>${band()}${labels()}</div></div>${bagKey()}
      <div class="tip" id="tip">${shown<0?t("play_tap"):t("play_tip")}</div>${verdict}
      ${done?`<div class="row"><button class="pill" data-a="play">${t("play_again")}</button></div>`:(playing?"":`<button class="big gold" data-a="play" style="flex:none">${t("play_btn")}</button>`)}` }; },

  fix: () => { const r=run();
    const btn = (a,l,cap,id,flag,sr) => `<button data-a="${a}" data-id="${id||""}" aria-label="${sr||cap||l}" ${flag&&flag.includes("min")?'aria-disabled="true"':""}>${l}${cap?`<small>${cap}</small>`:""}</button>`;
    const sr = (key,x) => t(key,{x});

    const ord = m => m===ALL ? -1 : m;
    const items = Object.entries(S.picks).filter(([k])=>!ITEM[k].surprise).sort((a,b)=>ord(a[1].m)-ord(b[1].m))

    const ok = r.runOut===null, cut = ok && eatCut();
    return { say: cut ? t("cut_say") : ok ? t("fix_ok_say") : t("fix_say",{minus:chip("−"),earlier:chip("◀"),later:chip("▶")}), mood:ok&&!cut?"happy":"think", next:true, body:`
      <div><div class="meter" style="--mh:100px;${meterStyle()}">${bars(r, 11)}</div>${band()}${labels()}${bagKey()}</div>
      <div class="tip" id="tip" style="color:var(${cut?"--ink2":ok?"--leaf":"--hungry"})">${cut?t("cut_tip"):ok?t("fix_ok"):t("fix_short",{b:nb(r.short)})}</div>
      <div class="fixlist">${items||`<span class="small">${t("noCosts")}</span>`}</div>
      ${row("🐀",t("keepSafeRow"),nb(reserve()),btn("r-","−","","","",sr("sr_less",t("keepSafeShort")))+btn("r+","+","","","",sr("sr_more",t("keepSafeShort"))))}
      ${row("🍲",t("eating"),`${fmt(S.eat)} ${t("bagsEachMoon")}`,btn("e-","−","",""," "+(S.eat<=.5?"min":""),sr("sr_less",t("eating")))+btn("e+","+","","","",sr("sr_more",t("eating"))))}
      ${S.eat0!==null && S.eat<S.eat0 ? `<div class="eatnote">${t("eat_less")}</div>`:""}
      ${cut?`<div class="verdict quiet"><b>${t("cut_head")}</b><ul class="cutlist">${cuts().map(c=>`<li>${c}</li>`).join("")}</ul><button class="pill strong" data-a="cutBack" style="justify-self:center">${t("cut_back")}</button></div>`:""}
      ${r.short>0?`<div class="verdict bad"><span class="note">${t("tooSmall")}</span></div>`:""}` }; },

  card: () => { const r=run(); return { say:t("card_say"), mood:r.runOut===null&&!eatCut()?"happy":"think", foot:`<button class="big gold" data-a="keep">${t("keep")}</button>`, body:`
    <div class="plancard"><div class="pc-grid">${r.out.map((o,i)=>`<div class="pc s-${SEASON[i]} ${o.low?"low":""} ${CHECKS.includes(i)?"check":""} ${i===11&&r.runOut===null?"harv":""}"><span class="nm">${MONTH_IC[i]} ${mName(i)}</span><span class="cnt">${o.low&&o.start<=0?"0":fmt(o.start)}</span><span class="it">${o.low&&o.start<=0?"🥣":Object.entries(S.picks).filter(([k,p])=>p.m===i&&!ITEM[k].surprise).map(([k])=>ITEM[k].ic).join("")}</span></div>`).join("")}</div>
      ${(()=>{ const ic=Object.entries(S.picks).filter(([k,p])=>p.m===ALL).map(([k])=>ITEM[k].ic).join(" "); return ic?`<div class="cardnote">${t("card_spread",{ic})}</div>`:""; })()}
      ${r.short>0?`<div class="cardnote bad">${t("card_short",{b:nb(r.short)})}</div>`:""}
      ${eatCut()?`<div class="cardnote"><b>${t("cut_card",{list:cuts().join(", ")})}</b></div>`:""}
      <div class="cardnote">${t("card_legend",{b:"🐀 "+nb(reserve())})}</div></div>
    ${remindersHtml(r)}
    ${ui.toast?`<div class="toast">${t("keep_toast")}</div>`:""}
    <div class="row"><button class="pill" data-a="restart">${t("startAgain")}</button><button class="pill" data-a="erase">${ui.eraseArmed?t("erase_sure"):t("erase")}</button></div>` }; }
};
function peopleRow(){ const v=S.people;
  return `<div class="fx"><span class="ic">👪</span><span class="t">${t("people")}<small class="ppl">${"🧑".repeat(Math.min(v,12))}${v>12?"…":""}</small></span><span class="ctl"><button data-a="ppl" data-d="-1" aria-label="less" ${v<=0?'aria-disabled="true"':""}>−</button><b class="famn">${v}</b><button data-a="ppl" data-d="1" aria-label="more">+</button></span></div>`; }
// ---- calendar reminders at the check months (Google Calendar link, or an .ics file) ----
function checkDates(r){
  const now=new Date(), y0 = now.getMonth()>=4 ? now.getFullYear() : now.getFullYear()-1; // harvest year starts in May
  return CHECKS.map(i=>{ const jm=(4+i)%12, y=y0+((4+i)>=12?1:0), d=new Date(y,jm,1);
    const inStore = Math.max(0,r.out[i].start)+reserve();
    return {i, d, inStore, text:t("remind_title"), details:t("remind_details",{b:nb(inStore), m:(PHRASES[LANG].monthsLong||PHRASES.en.monthsLong)[i], r:nb(reserve())})};
  }).filter(c=>c.d>now);
}
const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
const dayAfter = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()+1);
function gcalUrl(c){ return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(c.text)
  +"&dates="+ymd(c.d)+"/"+ymd(dayAfter(c.d))+"&details="+encodeURIComponent(c.details); }
function icsUrl(list){
  const esc = s => s.replace(/[\\,;]/g, m=>"\\"+m);
  const ev = list.map((c,n)=>["BEGIN:VEVENT","UID:bags-till-harvest-"+ymd(c.d)+"-"+n,"DTSTAMP:"+ymd(new Date())+"T000000Z",
    "DTSTART;VALUE=DATE:"+ymd(c.d),"DTEND;VALUE=DATE:"+ymd(dayAfter(c.d)),"SUMMARY:"+esc(c.text),"DESCRIPTION:"+esc(c.details),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc(c.text),"TRIGGER:PT9H","END:VALARM","END:VEVENT"].join("\r\n"));
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Bags Till Harvest//EN",...ev,"END:VCALENDAR"].join("\r\n");
  return URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
}
function remindersHtml(r){
  if(!FEATURES.reminders) return "";
  if(r.runOut!==null || eatCut()) return "";   // only offer reminders for a plan that lasts without cuts
  const list=checkDates(r); if(!list.length) return "";
  if(!S.remindOn) return `<div class="row"><button class="pill" data-a="remindOn">${t("remind_ask")}</button></div>`;
  return `<div class="remind"><b>${t("remind_head")}</b><div class="row">${list.map(c=>`<a class="pill" href="${gcalUrl(c)}" target="_blank" rel="noopener">${t("remind_btn",{m:mName(c.i),b:nb(c.inStore)})}</a>`).join("")}</div>
    <div class="row"><a class="pill" href="${icsUrl(list)}" download="bags-till-harvest.ics">${t("remind_all")}</a></div><span class="small">${t("remind_why")} ${t("remind_note")}</span></div>`;
}
function pins(n){ let h=""; for(let k=0;k<Math.floor(Math.min(n,8)+1e-9);k++) h+='<i class="pin"></i>'; const f=n%1; if(f>=.45) h+='<i class="pin half"></i>'; else if(f>.01) h+='<i class="pin tiny"></i>'; return h; }
function burst(){ let h=""; for(let i=0;i<10;i++){ const a=i/10*Math.PI*2; h+=`<i style="--dx:${Math.round(Math.cos(a)*90)}px;--dy:${Math.round(Math.sin(a)*60-30)}px"></i>`; } return h; }

// ================= NUDGES =================
// Asked once each, never blocking: the family can always carry on.
function needNudge(){
  const st=STEPS[S.step];
  if(st==="eat" && CHECK.food && !S.asked.food && S.eat < FOOD.askBelow*typicalEat()) return "food";
  if(st==="remember" && CATS[S.catIdx].id==="school" && CHECK.school && !S.asked.school
     && !Object.keys(S.picks).some(k=>ITEM[k].cat==="school")) return "school";
  if(st==="remember" && CATS[S.catIdx].surprise && CHECK.keepSafe && !S.asked.keepSafe && reserve()===0) return "keepSafe";
  return null;
}
function nudgeView(){
  const v = {s:nb(suggestEat()), b:nb(S.eat), p:S.people};
  const K = {food:["nudge_food","nudge_food_yes","nudge_food_no"], school:["nudge_school","nudge_school_yes","nudge_school_no"], keepSafe:["nudge_safe","nudge_safe_yes","nudge_safe_no"]}[nudge];
  return { say:t(K[0],v), card:`<div class="nudgecard"><button class="pill strong" data-a="nudgeYes">${t(K[1],v)}</button><button class="pill" data-a="nudgeNo">${t(K[2],v)}</button></div>` };
}

// ================= RENDER =================
let lastMood = null;
function render(){
  const st = STEPS[S.step], sc = SCREENS[st]();
  if(nudge){ const nv=nudgeView(); sc.say=nv.say; sc.body=nv.card+sc.body; sc.mood="think"; }
  const mood = sc.mood || FACE_FOR[st];
  $("#dots").innerHTML = STEPS.map((_,i)=>`<i class="${i<S.step?"done":i===S.step?"on":""}"></i>`).join("");
  if(mood!==lastMood){ $("#face").innerHTML = face(mood); const f=$("#face .face"); if(lastMood) f.classList.add("bob"); lastMood=mood; }
  $("#bubble").innerHTML = sc.say;
  const scroll = $("#pbody").scrollTop; $("#pbody").innerHTML = sc.body; $("#pbody").scrollTop = scroll;
  $("#pfoot").innerHTML = (S.step>0?`<button class="big back" data-a="back" aria-label="back">${t("back")}</button>`:"")
    + (sc.foot || `<button class="big go" data-a="next" aria-disabled="${!sc.next}">${sc.nextLabel||t("next")}</button>`);
  $("#phone").querySelectorAll(".sheet,.scrim").forEach(e=>e.remove());
  if(sheet) $("#phone").insertAdjacentHTML("beforeend", sheetHtml());
  $("#phone").dataset.say = sc.say;
  $("#phone").querySelectorAll(".ratdash").forEach(e=>e.remove());
  if(ui.ratRun){ $("#phone").insertAdjacentHTML("beforeend",`<div class="ratdash" aria-hidden="true"><span>🐀</span></div>`); setTimeout(()=>document.querySelectorAll(".ratdash").forEach(e=>e.remove()),2300); }
  ui = {};
}
function party(){
  document.querySelectorAll(".party").forEach(e=>e.remove());
  const bits=["🌽","🎉","🌽","✨","🌾"]; let h="";
  for(let i=0;i<36;i++) h+=`<i style="--x:${Math.round(Math.random()*100)}%;--d:${(Math.random()*.9).toFixed(2)}s;--r:${Math.round(Math.random()*720-360)}deg;--s:${(0.8+Math.random()*.9).toFixed(2)}">${bits[i%bits.length]}</i>`;
  $("#phone").insertAdjacentHTML("beforeend",`<div class="party" aria-live="polite">${h}<div class="ban">🎉 ${t("party")} 🎉</div></div>`);
  const f=$("#face .face"); if(f){ f.classList.remove("dance"); void f.offsetWidth; f.classList.add("dance"); }
  setTimeout(()=>document.querySelectorAll(".party").forEach(e=>e.remove()),3400);
}
function sheetHtml(){
  const it = ITEM[sheet.id];
  return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-label="${iName(it.id)}">
    <h3><span style="font-size:36px">${it.ic}</span>${iName(it.id)}<button class="x" data-a="close" aria-label="${t("close")}">✕</button></h3>
    ${stepper("s-","s+",fmt(sheet.b), (sheet.b>0&&sheet.b<=1?t("bag_one",{n:""}):t("bag_other",{n:""})).trim()+(sheet.m===ALL?" "+t("sheet_year"):"")+(S.showPrice||S.example?" · "+t("k",{n:Math.round(sheet.b*S.price)}):""))}
    ${sheet.b===0?"":it.surprise?`<div class="small">${t("sheet_surprise")}</div>`:`<div class="small" id="pickmsg">${sheet.warn?`<b style="color:var(--hungry)">${t("sheet_pick")}</b>`:t("sheet_which")}</div>${moonGrid(i=>sheet.m===i?"sel":"","sm")}<button class="m wide ${sheet.m===ALL?"sel":""}" data-a="sm" data-i="all"><span class="nm">${t("spread")}</span></button>`}
    <div class="pfoot" style="padding:0;border:none">${sheet.had?`<button class="big back" data-a="sdel" aria-label="remove">🗑️</button>`:""}
      <button class="big go" data-a="sok">${sheet.b===0?t("sheet_none"):t("sheet_ok")}</button></div></div>`;
}

// ================= ACTIONS =================
const markDone = () => { const id=CATS[S.catIdx].id; if(!S.catsDone.includes(id)) S.catsDone.push(id); };
function startPlay(){
  clearInterval(playing); playMonth=-1;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ playMonth=11; render(); if(run().runOut===null && !eatCut()) party(); return; }
  playing = setInterval(()=>{ playMonth++; if(playMonth>=11){ clearInterval(playing); playing=null; } render(); if(playMonth>=11 && run().runOut===null && !eatCut()) party(); }, 520);
  render();
}
function flashRow(id){ requestAnimationFrame(()=>{ const el=document.getElementById("fx-"+id); if(el) el.classList.add("flash"); }); }
const ACTIONS = {
  "h+":()=>{S.harvest=Math.min(60,S.harvest+1); ui.added=true;}, "h-":()=>S.harvest=Math.max(0,S.harvest-1),
  "p+":()=>S.price=Math.min(2000,S.price+25), "p-":()=>S.price=Math.max(0,S.price-25), "price":()=>S.showPrice=true,
  "new":()=>S=blank(), "ex":()=>S=example(), "restart":()=>{S.step=0; S.catIdx=0; S.asked={}; S.first=null; playMonth=-1; clearInterval(playing); playing=null;},
  "erase":()=>{ if(eraseArmed){ S=blank(); eraseArmed=false; } else { eraseArmed=true; ui.eraseArmed=true; setTimeout(()=>eraseArmed=false,3000); } },
  "keep":()=>ui.toast=true, "remindOn":()=>S.remindOn=true,
  "cutBack":()=>{ if(S.eat0!==null) S.eat=Math.max(S.eat,S.eat0);
    if(S.first) for(const [k,p] of Object.entries(S.first.picks)){ const c=S.picks[k]; if(!c) S.picks[k]={...p}; else if(c.b<p.b) c.b=p.b; }
    S.step=STEPS.indexOf("fix"); $("#pbody").scrollTop=0; },
  "exReveal":()=>{ const c=CATS[S.catIdx]; for(const [id] of c.items) if(S.exPicks[id]) S.picks[id]={...S.exPicks[id]}; },
  "recheck":()=>{ clearInterval(playing); playing=null; S.step=STEPS.indexOf("remember"); S.catIdx=0; $("#pbody").scrollTop=0; },
  "g":el=>S.guess=+el.dataset.i,
  "ppl":el=>{ S.people=Math.max(0,Math.min(20,S.people+ +el.dataset.d)); },
  "nudgeYes":()=>{ S.asked[nudge]=true; if(nudge==="food"){ S.eat=suggestEat(); } nudge=null; },
  "nudgeNo":()=>{ S.asked[nudge]=true; nudge=null; return ACTIONS.next({getAttribute:()=>null}); },
  "e+":()=>{S.eat=Math.min(6,S.eat+.5); ui.added=true;}, "e-":()=>S.eat=Math.max(.5,S.eat-.5),
  "cat":el=>{markDone(); S.catIdx=+el.dataset.i; if(CATS[S.catIdx].surprise) ui.ratRun=true;},
  "item":el=>{const id=el.dataset.id, p=S.picks[id]; sheet={id, b:p?p.b:1, m:p?p.m:(SPREAD_BY_DEFAULT.includes(ITEM[id].cat)?ALL:null), had:!!p};},
  "s+":()=>sheet.b=Math.min(20,sheet.b+.5), "s-":()=>sheet.b=Math.max(0,sheet.b-.5),
  "sm":el=>{sheet.m=el.dataset.i==="all"?ALL:+el.dataset.i; sheet.warn=false;},
  "sok":()=>{ if(sheet.b===0){ delete S.picks[sheet.id]; sheet=null; return; } if(ITEM[sheet.id].surprise||sheet.m!==null){ S.picks[sheet.id]={b:sheet.b,m:sheet.m}; sheet=null; }
    else { sheet.warn=true; render(); const g=$("#moons"); g.classList.add("nudge"); return "skip"; } },
  "sdel":()=>{ delete S.picks[sheet.id]; sheet=null; }, "close":()=>sheet=null,
  "fx-":el=>{ const id=el.dataset.id, p=S.picks[id]; p.b-=.5; if(p.b<=0) delete S.picks[id]; else flashRow(id); },
  "fx<":el=>{ const p=S.picks[el.dataset.id]; if(p.m===ALL) return; p.m=Math.max(0,p.m-1); flashRow(el.dataset.id); },
  "fx>":el=>{ const p=S.picks[el.dataset.id]; if(p.m===ALL) return; p.m=Math.min(11,p.m+1); flashRow(el.dataset.id); },
  "r+":()=>{ const k=Object.keys(S.picks).find(k=>ITEM[k].surprise)||"other"; S.picks[k]={b:(S.picks[k]?.b||0)+.5,m:null}; },
  "r-":()=>{ const k=Object.keys(S.picks).find(k=>ITEM[k].surprise); if(k){ S.picks[k].b-=.5; if(S.picks[k].b<=0) delete S.picks[k]; } },
  "next":el=>{ if(el.getAttribute("aria-disabled")==="true") return "skip";
    if(nudge){ S.asked[nudge]=true; nudge=null; }
    else { const n=needNudge(); if(n){ nudge=n; if(n==="keepSafe") ui.ratRun=true; return; } }
    if(STEPS[S.step]==="eat"){ if(S.eat0===null) S.eat0=S.eat; S.catIdx=0; }
    if(STEPS[S.step]==="remember"){ markDone(); if(S.catIdx<CATS.length-1){ S.catIdx++; if(CATS[S.catIdx].surprise) ui.ratRun=true; $("#pbody").scrollTop=0; return; } }
    if(STEPS[S.step]==="remember" && !S.first) S.first={picks:JSON.parse(JSON.stringify(S.picks)), reserve:reserve()};
    S.step=Math.min(STEPS.length-1,S.step+1); $("#pbody").scrollTop=0; if(STEPS[S.step]==="play"){ playMonth=-1; clearInterval(playing); playing=null; } },
  "back":()=>{ if(STEPS[S.step]==="remember" && S.catIdx>0){ S.catIdx--; return; } clearInterval(playing); playing=null; S.step=Math.max(0,S.step-1); $("#pbody").scrollTop=0; },
  "play":()=>{ startPlay(); return "skip"; }
};
let eraseArmed = false;
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-a]"); if(!b) return;
  const a = b.dataset.a;
  if(nudge && !["next","nudgeYes","nudgeNo"].includes(a)) nudge=null;
  const wasShort = STEPS[S.step]==="fix" && run().runOut!==null;
  const f = ACTIONS[a]; if(f && f(b)==="skip") return; render();
  if(wasShort && STEPS[S.step]==="fix" && run().runOut===null && !eatCut()) party();
});
const showTip = e => { const b=e.target.closest(".meter .b"); if(b && $("#tip")) $("#tip").textContent=b.dataset.tip; };
document.addEventListener("pointerover", showTip); document.addEventListener("focusin", showTip);
$("#soundBtn").addEventListener("click", ()=>{ $("#soundBtn").classList.remove("hello"); speak($("#phone").dataset.say); });
render();
})();
</script>
