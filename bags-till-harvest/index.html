<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bags Till Harvest</title>
<script src="qrcode.js"></script><!-- qrcode-generator 1.4.4, MIT, Kazuhiko Arase; local so QR codes work offline -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#2b251f; --body:#4a4238; --muted:#6b6256; --line:#d9d1c3;
  --screen:#fcfaf6; --page:#f3eee5; --chip:#efe9de; --pic:#f3eee5; --rule:#e7e0d3;
  --maize:oklch(0.78 0.13 80); --maize-dk:oklch(0.55 0.10 75); --maize-soft:oklch(0.94 0.045 85);
  --short:oklch(0.72 0.14 32); --short-dk:oklch(0.50 0.12 32); --short-soft:oklch(0.93 0.04 32);
  --stripe:repeating-linear-gradient(135deg,#efe9de 0 5px,#f7f3ec 5px 10px);
  --on-maize:#2b251f;
  --font:Archivo, Helvetica, Arial, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#f1ebe0; --body:#d6ccbd; --muted:#a99f90; --line:#4a4337;
    --screen:#1c1915; --page:#12100d; --chip:#2a2520; --pic:#26221c; --rule:#332e27;
    --maize:oklch(0.78 0.13 80); --maize-dk:oklch(0.62 0.10 75); --maize-soft:oklch(0.34 0.05 80);
    --short:oklch(0.68 0.14 32); --short-dk:oklch(0.78 0.10 32); --short-soft:oklch(0.33 0.06 32);
    --stripe:repeating-linear-gradient(135deg,#2a2520 0 5px,#221e19 5px 10px);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#f1ebe0; --body:#d6ccbd; --muted:#a99f90; --line:#4a4337;
  --screen:#1c1915; --page:#12100d; --chip:#2a2520; --pic:#26221c; --rule:#332e27;
  --maize:oklch(0.78 0.13 80); --maize-dk:oklch(0.62 0.10 75); --maize-soft:oklch(0.34 0.05 80);
  --short:oklch(0.68 0.14 32); --short-dk:oklch(0.78 0.10 32); --short-soft:oklch(0.33 0.06 32);
  --stripe:repeating-linear-gradient(135deg,#2a2520 0 5px,#221e19 5px 10px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  padding:20px 16px;display:grid;justify-items:center;align-items:start}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--maize-dk);outline-offset:2px}
a{color:var(--ink)}

/* ---------- phone shell ---------- */
.phone{position:relative;width:100%;max-width:400px;height:min(800px,calc(100dvh - 40px));background:var(--screen);
  border:10px solid #2b251f;border-radius:42px;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:440px){body{padding:0}.phone{border:none;border-radius:0;height:100dvh;max-width:none}}
.top{display:flex;align-items:center;gap:12px;padding:16px 16px 6px}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--ink)} .dots i.on{background:var(--maize)}
.speak{width:52px;height:52px;flex:none;border-radius:50%;border:2px solid #2b251f;background:var(--maize);display:grid;place-items:center;padding:0}
.say{padding:6px 20px 14px;font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.01em;text-wrap:pretty;min-height:74px}
.body{flex:1;overflow-y:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:16px}
.body>*{flex-shrink:0}
.foot{display:flex;gap:10px;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--chip)}
.back{flex:0 0 64px;min-height:62px;border-radius:18px;border:2px solid var(--line);background:var(--chip);font-size:24px;font-weight:700}
.next{flex:1;min-height:62px;border-radius:18px;border:none;background:var(--ink);color:var(--screen);font-size:22px;font-weight:700}
.next[aria-disabled="true"]{opacity:.4}

/* ---------- shared ---------- */
.sub{font-size:16px;color:var(--body);line-height:1.4}
.small{font-size:13px;color:var(--body);line-height:1.4}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.pill{border:2px solid var(--line);background:var(--screen);border-radius:999px;padding:10px 18px;font-size:15px;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn{min-height:52px;border-radius:16px;border:2px solid var(--ink);background:var(--screen);font-size:16px;font-weight:700;display:grid;place-items:center;text-decoration:none;padding:0 12px}
.btn.gold{background:var(--maize);color:var(--on-maize);border-width:3px;min-height:56px;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:14px;border:2px dashed var(--maize-dk);background:var(--maize-soft);font-size:15px}
.banner button{border:none;background:none;font-weight:700;text-decoration:underline;padding:6px;font-size:15px}
.dashed{border:2px dashed var(--maize-dk);background:var(--maize-soft);border-radius:14px;padding:10px 14px;font-size:15px;font-weight:600;min-height:48px}
.hint{font-size:15px;color:var(--body);padding:10px 12px;border-radius:12px;background:var(--maize-soft)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--rule);padding-top:12px}
.total span{font-size:16px;color:var(--body)} .total b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;padding-top:6px}
.stepper button{width:68px;height:68px;border-radius:50%;border:3px solid var(--ink);background:var(--screen);font-size:34px;font-weight:700;line-height:1;padding:0}
.stepper button[aria-disabled="true"]{opacity:.35}
.stepper .n{font-size:68px;font-weight:800;min-width:110px;text-align:center;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.people{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:14px;border:2px solid var(--line)}
.people span{font-size:16px;font-weight:600}
.stepper.small{gap:10px;padding:0} .stepper.small button{width:48px;height:48px;font-size:26px;border-width:2px} .stepper.small .n{font-size:30px;min-width:44px}
.unit{text-align:center;font-size:17px;color:var(--body);margin-top:-8px}
.pic{border-radius:12px;background:var(--pic);display:grid;place-items:center}
.pic img{object-fit:contain}

/* ---------- sacks: a sack silhouette used as a mask, so the colour follows the theme ---------- */
.sacks{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:flex-end;min-height:30px}
.sk{display:block;flex:none;width:18px;height:22px;background:var(--maize);
  -webkit-mask:var(--sack-up) center/contain no-repeat;mask:var(--sack-up) center/contain no-repeat}
.sk.half{width:12px;height:15px}
.sk.big{width:26px;height:32px} .sk.big.half{width:17px;height:21px}
.sk.ink{background:var(--ink)}
.sk.hollow{background:var(--line);-webkit-mask-image:var(--sack-up-line);mask-image:var(--sack-up-line)}
.sk.dk{background:var(--maize-dk)}

/* ---------- phone screen ---------- */
.choice{display:flex;flex-direction:column;gap:10px;text-align:left;padding:12px;border-radius:20px;border:3px solid var(--line);background:var(--screen)}
.choice.on{border-color:var(--ink);background:var(--maize-soft)}
.choice .pic{height:120px} .choice .pic img{height:96px;width:96px}
.choice b{font-size:22px} .choice span{font-size:15px;color:var(--body);line-height:1.35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:12px 10px;border-radius:16px;border:3px solid var(--line);background:var(--screen);display:flex;flex-direction:column;gap:2px;text-align:left;min-height:64px}
.opt.on{border-color:var(--ink);background:var(--maize-soft)}
.opt b{font-size:17px} .opt span{font-size:14px;color:var(--body)}
.monthpick{display:flex;align-items:center;justify-content:center;gap:14px}
.monthpick button{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--screen);font-size:20px}
.monthpick span{font-size:18px;font-weight:600;min-width:120px;text-align:center}

/* ---------- remember ---------- */
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.tab{border:2px solid var(--ink);background:var(--screen);border-radius:10px;padding:6px 0;font-size:11px;font-weight:700;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tab.on{background:var(--ink);color:var(--screen)}
.tab small{font-size:10px;font-weight:600;min-height:12px}
.catline{font-size:14px;font-weight:600;color:var(--body)}
.rat{font-size:22px;margin-right:6px;display:inline-block;vertical-align:middle}
.ratdash{position:absolute;left:0;right:0;top:34%;z-index:6;pointer-events:none;display:flex;justify-content:center}
.ratdash span{font-size:92px;line-height:1;filter:drop-shadow(0 6px 4px rgb(0 0 0/.25));animation:ratfade 2.2s forwards}
@keyframes ratfade{0%,75%{opacity:1}100%{opacity:0}}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{position:relative;border:3px solid var(--line);background:var(--screen);border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:6px;text-align:left}
.card.on{border-color:var(--ink);background:var(--maize-soft)}
.card .pic{height:72px;border-radius:9px} .card .pic img{height:62px;width:62px}
.card b{font-size:15px;line-height:1.15;min-height:36px}
.card .tag{position:absolute;top:-10px;right:-6px;background:var(--ink);color:var(--screen);border-radius:999px;padding:3px 10px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- play ---------- */
.storehead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.storehead .lab{font-size:14px;color:var(--body);font-weight:600}
.storehead .num{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.keepbox{display:flex;flex-direction:column;align-items:flex-end;padding:8px 10px;border-radius:12px;border:2px dashed var(--ink)}
.keepbox span{font-size:13px;font-weight:600} .keepbox b{font-size:24px;font-weight:800}
.chart{display:flex;flex-direction:column;gap:4px}
.cols{display:grid;gap:3px;align-items:end;border-bottom:3px solid var(--ink)}
.col{display:flex;flex-direction:column;align-items:stretch;gap:3px}
.col .v{text-align:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;min-height:15px}
.stack{height:168px;border-radius:6px 6px 0 0;display:flex;flex-direction:column-reverse;gap:2px;padding:2px 2px;position:relative;outline:3px solid transparent;outline-offset:-2px}
.stack.fut{background:var(--stripe)} .stack.low{background:var(--short-soft)} .stack.cur{outline-color:var(--ink)}
.stack i{display:block;flex:none;height:8px;background:var(--maize);-webkit-mask:var(--sack-lying) center/100% 100% no-repeat;mask:var(--sack-lying) center/100% 100% no-repeat}
.stack.low i{background:var(--short)}
.stack .bang{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:22px;font-weight:800}
.labs{display:grid;gap:3px}
.labs div{display:flex;flex-direction:column;align-items:center;gap:3px}
.labs span{font-size:11px;font-weight:700;letter-spacing:-.02em}
.labs p{display:flex;gap:2px;min-height:6px;margin:0}
.labs p i{width:6px;height:6px;border-radius:1px;background:var(--ink)}
.key{display:flex;gap:14px;font-size:12px;color:var(--body);justify-content:center;padding-top:2px}
.key span{display:flex;align-items:center;gap:5px}
.key .ks{width:18px;height:8px;background:var(--maize);-webkit-mask:var(--sack-lying) center/100% 100% no-repeat;mask:var(--sack-lying) center/100% 100% no-repeat}
.key .kd{width:6px;height:6px;border-radius:1px;background:var(--ink)}
.caption{min-height:52px;font-size:18px;font-weight:600;line-height:1.3;text-align:center;text-wrap:pretty}
.playbtn{min-height:60px;border-radius:18px;border:3px solid var(--ink);background:var(--screen);font-size:19px;font-weight:700}
.playbtn.gold{background:var(--maize);color:var(--on-maize)}
.result{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;border:3px solid var(--ink)}
.result.good{background:var(--maize-soft)} .result.bad{background:var(--short-soft)} .result.cut{background:var(--chip)}
.result h3{margin:0;font-size:24px;font-weight:800;line-height:1.1}
.result p{margin:0;font-size:16px;line-height:1.35}
.result ul{margin:0;padding-left:20px}
.recall{display:flex;flex-direction:column;gap:8px;border-top:2px solid color-mix(in srgb,var(--ink) 20%,transparent);padding-top:12px}
.recall>b{font-size:14px}
.bars{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;font-size:14px}
.bars .track{height:18px;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:4px}
.bars .track div{height:100%;border-radius:4px}
.bars .g{background:var(--screen);border:2px solid var(--ink)} .bars .r{background:var(--ink)}
.linkbtn{align-self:center;border:none;background:none;text-decoration:underline;font-size:15px;padding:8px}

/* ---------- say it back + home ---------- */
.choices3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choices3 button{min-height:96px;border-radius:20px;border:3px solid var(--ink);background:var(--screen);font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.choices3 .right{background:var(--maize);color:var(--on-maize)} .choices3 .wrong{background:var(--short-soft)}
.fb{font-size:18px;font-weight:700}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;border:2px solid var(--ink);background:var(--screen)}
.check.low{background:var(--short-soft)}
.check span{font-size:18px;font-weight:600} .check b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.sect{display:flex;flex-direction:column;gap:10px}
.sect>b{font-size:17px}
.lrow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:14px;border:2px solid var(--line);background:var(--screen)}
.lrow .pic{height:48px;border-radius:8px} .lrow .pic img{height:40px;width:40px}
.lrow span{font-size:17px;font-weight:600} .lrow b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.toggle{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 14px;border-radius:16px;border:3px solid var(--ink);background:var(--screen);font-size:17px;font-weight:700}
.toggle.on{background:var(--maize);color:var(--on-maize)}
.crow{display:flex;justify-content:space-between;font-size:16px;padding:0 4px}
.tel{min-height:56px;border-radius:14px;border:2px solid var(--ink);padding:0 14px;font-size:20px;font-family:inherit;background:var(--screen);color:var(--ink);width:100%}
.smsbox{padding:12px;border-radius:12px;background:var(--chip);font-family:var(--mono);font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.erase.armed{background:var(--short-soft)}
.qr{display:grid;place-items:center;background:#fff;padding:10px;border-radius:12px;min-height:60px}
.qr svg{display:block;width:210px;height:210px}
.linkbox{width:100%;font-size:12px;padding:6px;border:1px solid var(--line);border-radius:8px}
.credit{font-size:11px;color:var(--muted);text-align:center}
.credit a{color:var(--muted)}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(30,25,20,.45);z-index:4}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--screen);border-radius:28px 28px 0 0;border-top:4px solid var(--ink);
  padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto}
.sheet .hd{display:flex;gap:12px;align-items:center}
.sheet .hd .pic{width:64px;height:64px;flex:none} .sheet .hd .pic img{height:54px;width:54px}
.sheet .hd b{font-size:24px;font-weight:800;flex:1;line-height:1.1}
.sheet .x{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--screen);font-size:18px}
.sheet .stepper button{width:60px;height:60px;font-size:30px} .sheet .stepper .n{font-size:56px;min-width:100px}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.months button{min-height:48px;border-radius:12px;border:2px solid var(--ink);background:var(--screen);font-size:15px;font-weight:700}
.months button.on{background:var(--ink);color:var(--screen)}
.months .every{grid-column:1/-1}
.keepnote{padding:12px;border-radius:12px;border:2px dashed var(--ink);font-size:16px;line-height:1.35}
.save{min-height:60px;border-radius:18px;border:none;background:var(--ink);color:var(--screen);font-size:20px;font-weight:700}
.save[aria-disabled="true"]{opacity:.4}
.nudge{animation:nudge .45s}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- celebration ---------- */
.party{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.party i{position:absolute;top:-50px;left:var(--x);font-style:normal;font-size:calc(26px * var(--s));display:none}
.party .ban{position:absolute;top:32%;left:6%;right:6%;background:var(--maize);color:#2b251f;font-weight:800;font-size:30px;line-height:1.1;text-align:center;border-radius:22px;padding:18px 12px;border:3px solid #2b251f;box-shadow:0 6px 0 #2b251f;animation:banout .4s 3s forwards}
@keyframes banout{to{opacity:0}}
@media (prefers-reduced-motion: no-preference){
  .party i{display:block;animation:fall 2.6s var(--d) cubic-bezier(.3,.1,.7,1) forwards}
  @keyframes fall{to{transform:translateY(880px) rotate(var(--r))}}
  .party .ban{animation:banin .5s cubic-bezier(.2,1.6,.4,1), banout .4s 3s forwards}
  @keyframes banin{from{transform:scale(.3) rotate(-8deg);opacity:0}}
  .sacks .sk.new{animation:drop .25s ease-out}
  @keyframes drop{0%{transform:translateY(-14px);opacity:0}80%{transform:translateY(0) scaleY(.94)}100%{transform:none;opacity:1}}
  .speak.hello{animation:pulse 1.2s 2}
  .rat.run{animation:scurry 1s 1.8s ease-out backwards}
  @keyframes scurry{0%{transform:translateX(-300px) scaleX(-1)}70%{transform:translateX(10px) scaleX(-1)}100%{transform:none}}
  .ratdash span{animation:ratdash 2.2s ease-in-out forwards}
  @keyframes ratdash{0%{transform:translateX(-120vw) scaleX(-1)}30%{transform:translateX(0) scaleX(-1)}40%{transform:translateX(0) scaleX(-1) rotate(-8deg)}50%{transform:translateX(0) scaleX(-1) rotate(6deg)}62%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(120vw) scaleX(-1)}}
  @keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--maize) 35%,transparent)}}
}
</style>
</head>
<body>
<div class="phone" id="phone" aria-label="Bags Till Harvest">
  <div class="top">
    <div class="dots" id="dots"></div>
    <button class="speak hello" id="speakBtn" aria-label="Read aloud">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><polygon points="3,9 7,9 12,4 12,20 7,15 3,15" fill="#2b251f"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" stroke="#2b251f" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="say" id="say" aria-live="polite"></div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
(() => {
// ================= PHRASE BANK (English only for now) =================
// Every word the farmer sees lives here. {name} placeholders are filled in by t().
// {b} is always an amount of bags that is already worded ("1 bag", "3½ bags").
// To add a language, copy the en block, translate the values, and set LANG.
const PHRASES = {
  en: {
    bag_one:"{n} bag", bag_other:"{n} bags",
    next:"Next ›", next_cat:"Next: {c} ›", back_aria:"Back", read_aloud:"Read aloud", less:"Less", more:"More",
    months:["May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar","Apr"],
    monthsLong:["May","June","July","August","September","October","November","December","January","February","March","April"],
    // 1 phone
    say_phone:"Whose phone is this?",
    own:"My own phone", own_sub:"Plan privately. Reminders can go in my calendar.",

const FEATURES = { reminders: !PRESENTER && !/[?&]reminders=off\b/.test(Q), shareApp: PRESENTER, outsideInfo: !/[?&]outside=off\b/.test(Q) };

const FOOD = { kgPerPersonYear:150, bagKg:50, askBelow:.75 };

const nowIdx = () => (new Date().getMonth() - 4 + 12) % 12;        // today's month, May = 0
function blank(){ return {screen:0, own:PRESENTER?false:null, bags:0, startMode:"harvest", start:Math.min(10,nowIdx()), prior:0, cat:0, visited:[],
  picks:{}, eat:1, people:0, foodAsked:false, first:null, teach:null, remindOn:false, phoneNum:"", ex:false, exPicks:{}, received:false, showQR:false, shareApp:false}; }

// ================= MODEL =================
const st = () => S.startMode==="harvest" ? 0 : S.start;               // first month of the plan
const months = () => 12 - st();
const reserve = () => Object.values(S.picks).filter(p=>p.m===KEEP).reduce((a,p)=>a+p.b,0);
// A dated cost set before the start month is paid in the start month; a spread cost is split over the months left.
function spendIn(m){ const s0=st(), n=months();
  return Object.values(S.picks).reduce((a,p)=> a + (p.m===ALL ? p.b/n : (p.m!==KEEP && p.m!==null && Math.max(s0,p.m)===m ? p.b : 0)), 0); }
function run(){ const s0=st(); let stock=S.bags-reserve(); const out=[]; let runOut=null, dry=0;
  for(let m=s0;m<12;m++){ const start=stock, cost=spendIn(m); stock -= S.eat + cost; const low = stock < -1e-9;   // tolerance: spread costs split into fractions
    if(low){ if(runOut===null) runOut=m; dry++; } out.push({m, start:Math.max(0,start), cost, left:Math.max(0,stock), low}); }
  return {out, runOut, dry, end:stock}; }
const total = () => Object.values(S.picks).reduce((a,p)=>a+p.b,0);
// Check months every three months from the start; the value is what the farmer will count, kept-safe bags included.
function checks(){ const s0=st(), r=run(), rs=reserve(); let cm=[s0+3,s0+6,s0+9].filter(m=>m<=11); if(!cm.length) cm=[11];
  return cm.map(m=>{ const o=r.out[m-s0]; return {m, v:(o?o.start:0)+rs, low:!!(o&&o.low)}; }); }
// "First list" = costs, kept-safe bags and food when the family first finishes Food. Cutting any of them later means
// the plan only lasts after cuts, which gets no celebration and no reminders. Moving a cost to another month is not a cut.
function cuts(){ const out=[], f=S.first; if(!f) return out;
  if(S.eat < f.eat-1e-9) out.push("🌽 "+t("cut_eat",{a:nb(f.eat),b:nb(S.eat)}));
  if(reserve() < f.reserve-1e-9) out.push("🔒 "+t("cut_keep"));
  for(const [k,p] of Object.entries(f.picks)) if(p.m!==KEEP && (!S.picks[k] || S.picks[k].b < p.b-1e-9)) out.push(iName(k));
  return out; }
const works = () => run().runOut===null && !cuts().length;

      <button class="linkbtn" data-a="replay">${t("play_again")}</button>`;
    return { say:t("say_play"), next:done, body:`
      <div class="storehead"><div style="display:flex;flex-direction:column"><span class="lab">${cur?t("store_end",{m:mL(cur.m)}):t("store_now")}</span><span class="num">${fmt(cur?cur.left:base)}</span></div>
        ${rs?`<div class="keepbox"><span>${t("kept_safe")}</span><b>${fmt(rs)}</b></div>`:""}</div>
      <div class="chart"><div class="cols" style="grid-template-columns:${cols}">${r.out.map(col).join("")}</div>
        <div class="labs" style="grid-template-columns:${cols}">${r.out.map(lab).join("")}</div>
        <div class="key"><span><i class="ks"></i>${unit===1?t("unit_one"):t("unit_many",{n:unit})}</span><span><i class="kd"></i>${t("cost_key")}</span></div></div>
      <div class="caption" aria-live="polite">${caption}</div>
      ${done ? result : `<div class="grid2"><button class="playbtn" data-a="step">${t("next_month")}</button><button class="playbtn gold" data-a="playAll">${t("play_all")}</button></div>`}` }; },

  teach(){ const ck=checks(), c0=ck[0]; let ch=[c0.v, c0.v+2, c0.v-2<0?c0.v+4:c0.v-2]; const rot=Math.round(c0.v)%3; ch=ch.slice(rot).concat(ch.slice(0,rot));
    return { say:t("say_teach",{m:mL(c0.m)}), next:S.teach!==null, body:`
    <div class="sub">${t("teach_sub")}</div>
    <div class="choices3">${ch.map(v=>`<button data-a="teach" data-v="${v}" class="${S.teach===null?"":v===c0.v?"right":S.teach===v?"wrong":""}">${fmt(v)}</button>`).join("")}</div>
    ${S.teach===null?"":`<div class="fb" aria-live="polite">${S.teach===c0.v?t("teach_right"):t("teach_wrong",{b:nb(c0.v)})}</div>
      <div class="checks"><span class="sub">${t("teach_days")}</span>${ck.map(k=>`<div class="check ${k.low?"low":""}"><span>${t("day",{m:mL(k.m)})}</span><b>${fmt(k.v)}</b></div>`).join("")}</div>`}` }; },

  home(){ const n=months(), base=Math.max(0,S.bags-reserve()), sum=id=>Object.entries(S.picks).filter(([k,p])=>ITEM[k].cat===id&&p.m!==KEEP).reduce((a,[,p])=>a+p.b,0);
    const rows=[[t("lab_food"),"1F33D",Math.min(S.eat*n,base)],[t("cat_school"),"1F3EB",sum("school")],[t("cat_home"),"1F3E0",sum("home")],[t("cat_farm"),"1F331",sum("farm")],
      [t("cat_give"),"1F932",sum("give")],[t("cat_other"),"2754",sum("other")],[t("lab_keep"),"1F512",reserve()]].filter(x=>x[2]>0);
    const ck=checks();
    const own = S.own!==false ? `<div class="sect"><b>${t("remind_head")}</b>
      ${!FEATURES.reminders ? "" : !works() ? `<span class="small">${t("remind_wait")}</span>` : `
        <button class="toggle ${S.remindOn?"on":""}" data-a="remind" aria-pressed="${S.remindOn}"><span>${S.remindOn?t("remind_on"):t("remind_off")}</span><span>${S.remindOn?"✓":"○"}</span></button>
        ${S.remindOn ? `${ck.map(k=>`<div class="crow"><span>${t("day",{m:mL(k.m)})}</span><b>${fmt(k.v)}</b></div>`).join("")}
          ${reminderLinks()}<span class="small">${t("remind_note")}</span>` : ""}`}</div>` : "";
    const borrowed = S.own===false ? `<div class="sect"><b>${t("send_head")}</b>
      <input class="tel" id="tel" data-a="tel" inputmode="tel" autocomplete="tel" placeholder="${t("tel_ph")}" value="${esc(S.phoneNum)}" aria-label="${t("tel_ph")}">
      <div class="smsbox" id="smsbox">${esc(smsText())}</div>
      <div class="grid2"><a class="btn gold" id="smsA" href="${smsHref()}">${t("sms")}</a><a class="btn" id="waA" href="${waHref()}" target="_blank" rel="noopener">${t("whatsapp")}</a></div>
      <span class="small">${t("send_note")}</span>
      ${S.showQR ? `<div class="sect"><span class="small">${t("qr_head")}</span>${qrBlock(planToLink())}</div>` : `<button class="pill" data-a="showQR" style="align-self:center">📲 ${t("qr_btn")}</button>`}
      <button class="btn erase ${eraseArmed?"armed":""}" data-a="erase">${eraseArmed?t("erase_sure"):t("erase")}</button></div>` : "";
    return { say:t("say_home"), next:false, noNext:true, body:`
      ${S.received?`<div class="banner"><span>${t("received")}</span></div>`:""}
      <div class="sect"><b>${t("mark")}</b>${rows.map(([name,pic,v])=>`<div class="lrow">${img(pic,40)}<span>${name}</span><b>${fmt(v)}</b></div>`).join("")}
        <span class="small">${t("mark_note")}</span></div>
      ${own}${borrowed}
      <p class="credit">${t("credit")}</p>` }; }
};

// ================= SHEET (amount and month for one cost) =================
function openSheet(id){ const it=ITEM[id], p=S.picks[id], s0=st();
  const m = p ? p.m : it.keep ? KEEP : it.dm===ALL ? ALL : it.dm==null ? null : Math.max(s0,it.dm);
  sheet = {id, b:p?p.b:1, m, had:!!p}; }
function sheetHtml(){ const it=ITEM[sheet.id], s0=st(), can=sheet.b>0 && sheet.m!=null;
  const ask = it.keep ? t("ask_keep") : sheet.m===ALL ? t("ask_year") : t("ask_bags");
  return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${iName(it.id)}">
    <div class="hd">${img(it.pic,54)}<b>${iName(it.id)}</b><button class="x" data-a="close" aria-label="${t("close")}">✕</button></div>
    <div class="sub">${ask}</div>
    ${stepper("s-","s+",fmt(sheet.b),[t("half_less"),t("half_more")],sheet.b<=.5,sheet.b>=20)}
    <div class="unit" style="font-size:15px">${(sheet.b>0&&sheet.b<=1?t("bag_one",{n:""}):t("bag_other",{n:""})).trim()}</div>
    ${it.keep ? `<div class="keepnote">${t("keep_note")}</div>` : `<b>${sheet.warn?`<span style="color:var(--short-dk)">${t("pick_month")}</span>`:t("when")}</b>
      <div class="months" id="months">${Array.from({length:12-s0},(_,i)=>{ const m=s0+i; return `<button class="${sheet.m===m?"on":""}" data-a="sm" data-i="${m}" aria-pressed="${sheet.m===m}">${mS(m)}</button>`; }).join("")}
        <button class="every ${sheet.m===ALL?"on":""}" data-a="sm" data-i="all" aria-pressed="${sheet.m===ALL}">${t("every_month")}</button></div>`}
    <button class="save" data-a="save" aria-disabled="${!can}">${t("save")}</button>
    ${sheet.had?`<button class="linkbtn" data-a="remove">${t("not_this_year")}</button>`:""}</div>`; }

// ================= SENDING, QR AND REMINDERS =================
const appUrl = () => location.origin + location.pathname;
const ascii = s => s.replace(/(\d)½/g,"$1 1/2").replace(/½/g,"1/2");          // plain characters keep it to one SMS
function smsText(){ return ascii(t("sms_text",{list:checks().map(k=>t("sms_item",{m:mS(k.m),v:fmt(k.v)})).join("; ")})); }
const telDigits = () => S.phoneNum.replace(/[^\d+]/g,"");
const smsHref = () => "sms:"+telDigits()+"?&body="+encodeURIComponent(smsText());
const waHref = () => "https://wa.me/"+telDigits().replace(/\D/g,"")+"?text="+encodeURIComponent(smsText()+"\n"+planToLink());
function qrBlock(url){ return `<div class="qr" data-text="${esc(url)}"></div>`; }
function drawQRs(){ document.querySelectorAll(".qr[data-text]").forEach(el=>{ const url=el.dataset.text; el.removeAttribute("data-text");
  if(window.qrcode){ try{ const q=qrcode(0,"M"); q.addData(url); q.make(); el.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true}); return; }catch(e){} }
  el.innerHTML = `<span class="small">${t("no_qr")}</span><input class="linkbox" readonly value="${esc(url)}">`; }); }
function sharePanel(head, url, waText){ return `<div class="sect" style="align-items:center"><span class="small">${head}</span>${qrBlock(url)}
  <a class="btn" href="https://wa.me/?text=${encodeURIComponent(waText)}" target="_blank" rel="noopener">${t("share_wa")}</a></div>`; }
// Calendar dates: the harvest year starts in May; plans made from April on belong to the year starting that May.
function checkDates(){ const now=new Date(), y0 = now.getMonth()>=3 ? now.getFullYear() : now.getFullYear()-1;
  return checks().map(k=>({...k, d:new Date(y0+((4+k.m)>=12?1:0), (4+k.m)%12, 1)})).filter(c=>c.d>now); }
const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
const dayAfter = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()+1);
const details = c => t("remind_details",{b:nb(c.v)});
function gcalUrl(c){ return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t("remind_title"))
  +"&dates="+ymd(c.d)+"/"+ymd(dayAfter(c.d))+"&details="+encodeURIComponent(details(c)); }
function icsUrl(list){
  const escI = s => s.replace(/[\\,;]/g, m=>"\\"+m);
  const fold = line => { const out=[]; let cur=""; for(const ch of line){ if(new TextEncoder().encode(cur+ch).length>73){ out.push(cur); cur=" "+ch; } else cur+=ch; } out.push(cur); return out.join("\r\n"); };
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const ev = list.map((c,n)=>["BEGIN:VEVENT","UID:bags-till-harvest-"+ymd(c.d)+"-"+n,"DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+ymd(c.d),"DTEND;VALUE=DATE:"+ymd(dayAfter(c.d)),
    "SUMMARY:"+escI(t("remind_title")),"DESCRIPTION:"+escI(details(c)),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+escI(t("remind_title")),"TRIGGER:PT9H","END:VALARM","END:VEVENT"].map(fold).join("\r\n"));
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Bags Till Harvest//EN",...ev,"END:VCALENDAR"].join("\r\n");
  if(icsUrl.last) URL.revokeObjectURL(icsUrl.last);
  return icsUrl.last = URL.createObjectURL(new Blob([ics],{type:"text/calendar;charset=utf-8"})); }
function reminderLinks(){ const list=checkDates(); if(!list.length) return "";
  return `<a class="btn" href="${icsUrl(list)}" download="bags-reminders.ics">${t("remind_ics")}</a>
    <div class="row">${list.map(c=>`<a class="pill" href="${gcalUrl(c)}" target="_blank" rel="noopener">${t("remind_gcal",{m:mS(c.m)})}</a>`).join("")}</div>`; }

// ---- plan in a link: #plan=<base64 JSON>; the part after # never reaches the web server ----
const encPicks = picks => Object.entries(picks).map(([id,p])=>[id,p.b,p.m===ALL?"a":p.m===KEEP?"k":p.m]);
function planToLink(){
  const o = {v:2, n:S.people, sm:S.startMode==="today"?1:0, s:S.start, h:S.bags, p:S.prior, e:S.eat, k:encPicks(S.picks), ex:S.ex?1:0,
    f: S.first ? {k:encPicks(S.first.picks), r:S.first.reserve, e:S.first.eat} : null};
  return appUrl() + "#plan=" + btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function planFromHash(){
  const m = location.hash.match(/^#plan=([\w-]+)/); if(!m) return null;
  try{ const o = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));
    // Every value is untrusted: known item keys only, and each number clamped to what the app allows.
    const num = (v,lo,hi,dflt) => { v=+v; return Number.isFinite(v) ? Math.min(hi,Math.max(lo,Math.round(v*2)/2)) : dflt; };
    const dec = list => { const out={}; for(const row of Array.isArray(list)?list:[]){ if(!Array.isArray(row)) continue; const [id,b,mm]=row;
      if(typeof id!=="string" || !Object.hasOwn(ITEM,id)) continue;
      const mo = mm==="a" ? ALL : mm==="k" ? KEEP : (Number.isInteger(mm)&&mm>=0&&mm<=11 ? mm : undefined);
      if(mo===undefined || (mo===KEEP)!==ITEM[id].keep) continue;
      out[id]={b:num(b,.5,20,1), m:mo}; } return out; };
    const picks = dec(o.k), f = o.f && typeof o.f==="object" ? o.f : null;
    const s = {...blank(), own:true, startMode:o.sm===1?"today":"harvest", start:Number.isInteger(o.s)&&o.s>=0&&o.s<=10?o.s:0,
      bags:Math.round(num(o.h,0,60,0)), people:Math.round(num(o.n,0,20,0)), prior:Math.round(num(o.p,0,60,0)), eat:num(o.e,.5,8,1), picks, ex:o.ex===1,
      visited:[0,1,2,3,4,5], screen:SCREENS.indexOf("home"), received:true};
    s.first = f ? {picks:dec(f.k), reserve:num(f.r,0,60,0), eat:num(f.e,.5,8,s.eat)} : null;
    return s;
  }catch(e){ return null; } }

// ================= CELEBRATION =================
function party(){
  document.querySelectorAll(".party").forEach(e=>e.remove());
  const bits=["🌽","🎉","🌽","✨","🌾"]; let h="";
  for(let i=0;i<36;i++) h+=`<i style="--x:${Math.round(Math.random()*100)}%;--d:${(Math.random()*.9).toFixed(2)}s;--r:${Math.round(Math.random()*720-360)}deg;--s:${(0.8+Math.random()*.9).toFixed(2)}">${bits[i%bits.length]}</i>`;
  $("#phone").insertAdjacentHTML("beforeend",`<div class="party" aria-live="polite">${h}<div class="ban">${t("party")}</div></div>`);
  setTimeout(()=>document.querySelectorAll(".party").forEach(e=>e.remove()),3400); }

// ================= RENDER =================
function render(){
  const scr=SCREENS[S.screen], sc=SCREEN[scr]();
  const fa=document.activeElement, fkey = fa && fa.dataset && fa.dataset.a ? `[data-a="${fa.dataset.a}"]`+["id","i","v"].map(k=>fa.dataset[k]!=null?`[data-${k}="${fa.dataset[k]}"]`:"").join("") : null;
  $("#dots").innerHTML = SCREENS.map((_,i)=>`<i class="${i<S.screen?"done":i===S.screen?"on":""}"></i>`).join("");
  if($("#say").textContent!==sc.say) $("#say").textContent = sc.say;
  const scroll=$("#body").scrollTop; $("#body").innerHTML = sc.body; $("#body").scrollTop = ui.top ? 0 : scroll;
  $("#foot").innerHTML = (S.screen>0?`<button class="back" data-a="back" aria-label="${t("back_aria")}">‹</button>`:"")
    + (sc.noNext ? "" : `<button class="next" data-a="next" aria-disabled="${!sc.next}">${sc.nextLabel||t("next")}</button>`);
  document.querySelectorAll(".sheet,.scrim").forEach(e=>e.remove());
  if(sheet) $("#phone").insertAdjacentHTML("beforeend", sheetHtml());
  drawQRs();
  document.querySelectorAll(".ratdash").forEach(e=>e.remove());
  if(ui.ratRun){ $("#phone").insertAdjacentHTML("beforeend",`<div class="ratdash" aria-hidden="true"><span>🐀</span></div>`); setTimeout(()=>document.querySelectorAll(".ratdash").forEach(e=>e.remove()),2300); }
  if(ui.sheetOpened) document.querySelector('.sheet [data-a="close"]')?.focus();
  else if(fkey){ const el=document.querySelector(fkey); if(el) el.focus({preventScroll:true}); }
  try{ if(window.parent!==window) window.parent.postMessage({bthStep:scr}, "*"); }catch(e){}
  ui = {};
}
function go(i){ clearInterval(playing); playing=null; sheet=null; eraseArmed=false; S.screen=Math.max(0,Math.min(7,i)); play=-1; ui.top=true;
  if(SCREENS[S.screen]==="play" && !S.first) S.first={picks:JSON.parse(JSON.stringify(S.picks)), reserve:reserve(), eat:S.eat}; }
function playTick(){ const n=months(); play=Math.min(n-1,play+1); if(play>=n-1){ clearInterval(playing); playing=null; if(works()) setTimeout(party,50); } render(); }

// ================= ACTIONS =================
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const ACTIONS = {
  own:el=>{ S.own = el.dataset.v==="true"; render(); setTimeout(()=>{ if(S.screen===0){ go(1); render(); } },180); return "skip"; },
  shareApp:()=>S.shareApp=true,
  startMode:el=>{ S.startMode=el.dataset.v; play=-1; },
  startPrev:()=>S.start=clamp(S.start-1,0,10), startNext:()=>S.start=clamp(S.start+1,0,10),
  "bags-":()=>{ S.bags=clamp(S.bags-1,0,60); S.prior=Math.min(S.prior,S.bags); }, "bags+":()=>{ S.bags=clamp(S.bags+1,0,60); ui.added=true; },
  example:()=>{ const own=S.own; S={...blank(), own, bags:16, startMode:"today", start:4, prior:3, eat:1, people:5, ex:true, exPicks:{...EX}, screen:S.screen}; },
  mine:()=>{ const own=S.own; S={...blank(), own, screen:1}; },
  "prior-":()=>S.prior=clamp(S.prior-1,0,60), "prior+":()=>S.prior=clamp(S.prior+1,0,S.bags||60),
  cat:el=>{ S.cat=+el.dataset.i; S.visited=[...new Set([...S.visited,S.cat])]; if(CATS[S.cat].keep) ui.ratRun=true; },
  reveal:()=>{ for(const [id] of CATS[S.cat].items) if(S.exPicks[id]) S.picks[id]={...S.exPicks[id]}; },
  item:el=>{ openSheet(el.dataset.id); ui.sheetOpened=true; },
  "s-":()=>sheet.b=clamp(sheet.b-.5,.5,20), "s+":()=>sheet.b=clamp(sheet.b+.5,.5,20),
  sm:el=>{ sheet.m = el.dataset.i==="all" ? ALL : +el.dataset.i; sheet.warn=false; },
  save:()=>{ if(sheet.m==null){ sheet.warn=true; render(); $("#months")?.classList.add("nudge"); return "skip"; }
    S.picks[sheet.id]={b:sheet.b,m:sheet.m}; sheet=null; play=-1; },
  remove:()=>{ delete S.picks[sheet.id]; sheet=null; play=-1; }, close:()=>sheet=null,
  "ppl-":()=>S.people=clamp(S.people-1,0,20), "ppl+":()=>S.people=clamp(S.people+1,0,20),
  nudgeYes:()=>{ S.eat=suggestEat(); S.foodNudge=false; },
  nudgeNo:()=>{ S.foodNudge=false; go(S.screen+1); },
  "eat-":()=>S.eat=clamp(S.eat-.5,.5,8), "eat+":()=>{ S.eat=clamp(S.eat+.5,.5,8); ui.added=true; },
  step:()=>{ clearInterval(playing); playing=null; playTick(); return "skip"; },
  playAll:()=>{ clearInterval(playing); if(play>=months()-1) play=-1;
    if(matchMedia("(prefers-reduced-motion: reduce)").matches){ play=months()-2; playTick(); return "skip"; }
    playing=setInterval(playTick, STEP_MS); playTick(); return "skip"; },
  replay:()=>{ clearInterval(playing); playing=null; play=-1; },
  toFood:()=>go(SCREENS.indexOf("food")), toCosts:()=>{ go(SCREENS.indexOf("remember")); S.cat=0; },
  cutBack:()=>{ const f=S.first; if(!f) return; S.eat=Math.max(S.eat,f.eat);
    for(const [k,p] of Object.entries(f.picks)){ const c=S.picks[k]; if(!c) S.picks[k]={...p}; else if(c.b<p.b) c.b=p.b; } play=-1; },
  teach:el=>S.teach=+el.dataset.v,
  remind:()=>S.remindOn=!S.remindOn,
  showQR:()=>S.showQR=true,
  erase:()=>{ if(eraseArmed){ eraseArmed=false; S=blank(); } else { eraseArmed=true; setTimeout(()=>{ if(eraseArmed){ eraseArmed=false; render(); } },3000); } },
  next:el=>{ if(el.getAttribute("aria-disabled")==="true") return "skip"; const scr=SCREENS[S.screen];
    if(scr==="remember" && S.cat<5){ S.cat++; S.visited=[...new Set([...S.visited,S.cat-1,S.cat])]; ui.top=true; if(CATS[S.cat].keep) ui.ratRun=true; return; }
    if(scr==="bags" && S.prior>S.bags) S.prior=S.bags;
    if(scr==="food"){ if(S.foodNudge){ S.foodNudge=false; }
      else if(FEATURES.outsideInfo && !S.foodAsked && S.eat < FOOD.askBelow*typicalEat()){ S.foodAsked=true; S.foodNudge=true; return; } }
    go(S.screen+1); },
  back:()=>{ if(SCREENS[S.screen]==="remember" && S.cat>0){ S.cat--; ui.top=true; return; } go(S.screen-1); }
};
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-a]"); if(!b || b.dataset.a==="tel") return;
  if(b.tagName==="A") return;                                   // real links (SMS, WhatsApp, calendar) do their own thing
  const f = ACTIONS[b.dataset.a]; if(!f) return; if(f(b)==="skip") return; render();
});
// Typing a phone number updates the SMS and WhatsApp links without redrawing the screen (keeps the keyboard open).
document.addEventListener("input", e=>{ if(e.target.id!=="tel") return; S.phoneNum=e.target.value;
  $("#smsA").href=smsHref(); $("#waA").href=waHref(); });
$("#speakBtn").addEventListener("click", ()=>{ $("#speakBtn").classList.remove("hello"); speak($("#say").textContent); });
$("#speakBtn").setAttribute("aria-label", t("read_aloud"));

// The design notes page embeds this app and can jump to a screen (loads the example family with all costs).
window.addEventListener("message", e=>{ if(window.parent===window || e.source!==window.parent) return;
  const i=e.data && e.data.bthGo; if(!Number.isInteger(i) || i<0 || i>=SCREENS.length) return;
  if(!S.ex && !Object.keys(S.picks).length) ACTIONS.example();
  if(S.own===null) S.own=!PRESENTER ? true : false;
  if(i>=SCREENS.indexOf("food")){ S.picks={...S.exPicks,...S.picks}; S.visited=[0,1,2,3,4,5]; }
  go(i); render(); });

const got = planFromHash(); if(got){ S = got; try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
render();
})();
</script>
</body>
</html>
